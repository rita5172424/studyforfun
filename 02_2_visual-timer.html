<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視覺沙漏與大字計時器 | 老師的教學百寶箱</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 沙漏流動液體動畫 */
        .sand-stream {
            transition: height 0.5s linear;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between text-slate-800">

    <!-- 頂部快速工具列 -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shadow-sm">
        <a href="./index.html" class="inline-flex items-center gap-2 text-indigo-600 font-bold hover:text-indigo-800 transition active:scale-95 text-sm">
            <span>🏠 返回百寶箱首頁</span>
        </a>
        <h1 class="text-base font-bold text-slate-700 hidden sm:block">視覺沙漏與大字計時器</h1>
        <button onclick="toggleFullScreen()" class="bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 font-medium px-3 py-1.5 rounded-lg text-xs transition active:scale-95 border border-indigo-200">
            🖥️ 全螢幕
        </button>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto w-full p-4 sm:p-6 flex-grow flex flex-col items-center justify-center">

        <!-- 快捷時長按鈕區 -->
        <div class="w-full max-w-xl mb-6 flex flex-wrap justify-center gap-2 sm:gap-3">
            <span class="text-xs text-slate-500 font-bold w-full text-center mb-1">快捷時間設定</span>
            <button onclick="setTimer(3)" class="quick-btn bg-white hover:bg-indigo-50 active:bg-indigo-100 border border-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm transition shadow-sm active:scale-95">3 分鐘</button>
            <button onclick="setTimer(5)" class="quick-btn bg-white hover:bg-indigo-50 active:bg-indigo-100 border border-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm transition shadow-sm active:scale-95">5 分鐘</button>
            <button onclick="setTimer(7)" class="quick-btn bg-white hover:bg-indigo-50 active:bg-indigo-100 border border-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm transition shadow-sm active:scale-95">7 分鐘</button>
            <button onclick="setTimer(10)" class="quick-btn bg-white hover:bg-indigo-50 active:bg-indigo-100 border border-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm transition shadow-sm active:scale-95">10 分鐘</button>
        </div>

        <!-- 自訂時長與提示文字輸入區 -->
        <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 w-full max-w-xl mb-6 flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <label for="customMinutes" class="text-xs text-slate-600 font-bold whitespace-nowrap">自訂分鐘:</label>
                <input type="number" id="customMinutes" min="1" max="120" value="5" class="w-20 px-3 py-1.5 border border-slate-300 rounded-lg text-center font-bold focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                <button onclick="applyCustomTimer()" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-medium px-3 py-1.5 rounded-lg text-xs transition active:scale-95">設定</button>
            </div>
            <div class="w-full sm:w-auto flex-1 sm:ml-4">
                <input type="text" id="customPromptText" placeholder="輸入大字提示文字（例如：安靜閱讀時間）" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
        </div>

        <!-- 核心計時與視覺沙漏顯示面板 -->
        <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-md border border-slate-200 w-full max-w-xl flex flex-col items-center relative overflow-hidden mb-6">
            
            <!-- 大字提示文字顯示 -->
            <div id="displayPrompt" class="text-indigo-600 font-extrabold text-lg sm:text-xl mb-4 tracking-wide text-center min-h-[30px]">
                準備就緒
            </div>

            <!-- 視覺沙漏容器 -->
            <div class="w-20 h-28 border-4 border-indigo-600 rounded-2xl flex flex-col justify-end overflow-hidden mb-6 bg-indigo-50 relative shadow-inner">
                <div id="sandFill" class="w-full bg-indigo-500 sand-stream" style="height: 100%;"></div>
            </div>

            <!-- 大字倒數計時器數字 -->
            <div id="timerDisplay" class="text-5xl sm:text-7xl font-black text-slate-800 tracking-wider mb-6 font-mono">
                05:00
            </div>

            <!-- 控制按鈕組 -->
            <div class="flex items-center gap-3 w-full">
                <button id="startPauseBtn" onclick="toggleStartPause()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3.5 px-6 rounded-xl text-base sm:text-lg transition shadow-md active:scale-95">
                    ▶ 開始計時
                </button>
                <button onclick="resetTimer()" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-bold py-3.5 px-6 rounded-xl text-base sm:text-lg transition active:scale-95">
                    🔄 重置
                </button>
            </div>

        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 text-center py-4 text-slate-400 text-xs">
        國中特教課堂工具箱 | 02_2_visual-timer.html
    </footer>

    <!-- 計時器邏輯與音效 -->
    <script>
        let totalTimeInSeconds = 300; // 預設 5 分鐘
        let remainingSeconds = 300;
        let timerInterval = null;
        let isRunning = false;

        // Web Audio API 音效產生器
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(freq, type, duration, volume = 0.1) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; // 'sine', 'square', etc.
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // 1. 倒數 1 分鐘提示音（清脆柔和）
        function playOneMinuteAlert() {
            playTone(587.33, 'sine', 0.4, 0.15); // D5
        }

        // 2. 最後 10 秒滴聲
        function playTickSound() {
            playTone(800, 'sine', 0.08, 0.08);
        }

        // 3. 最後 5 秒雙滴聲
        function playDoubleTickSound() {
            playTone(1046.50, 'sine', 0.08, 0.1); // C6
            setTimeout(() => playTone(1046.50, 'sine', 0.08, 0.1), 120);
        }

        // 4. 時間到響鈴（截然不同、嘹亮清晰的響鈴）
        function playAlarmSound() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    setTimeout(() => playTone(freq, 'triangle', 0.25, 0.2), idx * 250);
                });
            } catch (e) {}
        }

        // 設定時長（來自快捷按鈕）
        function setTimer(minutes) {
            if (isRunning) pauseTimer();
            totalTimeInSeconds = minutes * 60;
            remainingSeconds = totalTimeInSeconds;
            updateDisplay();
        }

        // 設定自訂時長
        function applyCustomTimer() {
            const mins = parseInt(document.getElementById('customMinutes').value);
            if (isNaN(mins) || mins <= 0) {
                alert('請輸入有效的分鐘數！');
                return;
            }
            if (isRunning) pauseTimer();
            totalTimeInSeconds = mins * 60;
            remainingSeconds = totalTimeInSeconds;
            updateDisplay();
        }

        // 更新畫面的數字與沙漏高度
        function updateDisplay() {
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            document.getElementById('timerDisplay').textContent = 
                String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

            // 計算沙漏高度百分比
            const percentage = (remainingSeconds / totalTimeInSeconds) * 100;
            document.getElementById('sandFill').style.height = percentage + '%';

            // 同步大字提示文字
            const promptText = document.getElementById('customPromptText').value.trim();
            document.getElementById('displayPrompt').textContent = promptText !== '' ? promptText : '計時進行中';
        }

        // 開始 / 暫停切換
        function toggleStartPause() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (remainingSeconds <= 0) return;
            isRunning = true;
            const btn = document.getElementById('startPauseBtn');
            btn.textContent = '❚❚ 暫停計時';
            btn.className = 'flex-1 bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold py-3.5 px-6 rounded-xl text-base sm:text-lg transition shadow-md active:scale-95';

            timerInterval = setInterval(() => {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    updateDisplay();

                    // 檢查音效觸發條件
                    if (remainingSeconds === 60) {
                        playOneMinuteAlert();
                    } else if (remainingSeconds <= 10 && remainingSeconds > 5) {
                        playTickSound();
                    } else if (remainingSeconds <= 5 && remainingSeconds > 0) {
                        playDoubleTickSound();
                    } else if (remainingSeconds === 0) {
                        playAlarmSound();
                        document.getElementById('displayPrompt').textContent = '⏱️ 時間到！';
                        pauseTimer();
                    }
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            const btn = document.getElementById('startPauseBtn');
            btn.textContent = '▶ 繼續計時';
            btn.className = 'flex-1 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3.5 px-6 rounded-xl text-base sm:text-lg transition shadow-md active:scale-95';
        }

        // 重置計時器
        function resetTimer() {
            pauseTimer();
            remainingSeconds = totalTimeInSeconds;
            updateDisplay();
            document.getElementById('displayPrompt').textContent = '準備就緒';
            document.getElementById('startPauseBtn').textContent = '▶ 開始計時';
        }

        // 監聽即時提示文字輸入
        document.getElementById('customPromptText').addEventListener('input', function() {
            const promptText = this.value.trim();
            document.getElementById('displayPrompt').textContent = promptText !== '' ? promptText : (isRunning ? '計時進行中' : '準備就緒');
        });

        // 全螢幕切換
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // 初始化畫面
        updateDisplay();
    </script>
</body>
</html>
