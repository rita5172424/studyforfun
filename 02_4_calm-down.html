<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級靜心專區 | 老師的教學百寶箱</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 呼吸球放大縮小動畫 */
        @keyframes breathe {
            0% { transform: scale(1); background-color: #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
            40% { transform: scale(1.45); background-color: #818cf8; box-shadow: 0 0 40px rgba(129, 140, 248, 0.7); }
            60% { transform: scale(1.45); background-color: #818cf8; box-shadow: 0 0 40px rgba(129, 140, 248, 0.7); }
            100% { transform: scale(1); background-color: #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
        }
        .breathe-ball {
            animation: breathe 8s infinite ease-in-out;
        }
        /* 暂停時的動畫狀態 */
        .paused {
            animation-play-state: paused !important;
        }
    </style>
</head>
<body id="pageBg" class="bg-sky-50 min-h-screen flex flex-col justify-between text-slate-800 transition-colors duration-700">

    <!-- 頂部快速工具列 -->
    <header class="bg-white/80 backdrop-blur border-b border-slate-200 px-6 py-3 flex justify-between items-center shadow-sm">
        <a href="./index.html" class="inline-flex items-center gap-2 text-indigo-600 font-bold hover:text-indigo-800 transition active:scale-95 text-sm">
            <span>🏠 返回百寶箱首頁</span>
        </a>
        <h1 class="text-base font-bold text-slate-700 hidden sm:block">班級靜心與情緒調控專區</h1>
        <button onclick="toggleFullScreen()" class="bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 font-medium px-3 py-1.5 rounded-lg text-xs transition active:scale-95 border border-indigo-200">
            🖥️ 全螢幕
        </button>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto w-full p-4 sm:p-6 flex-grow flex flex-col items-center justify-center">

        <!-- 色彩主題切換（感官安撫偏好） -->
        <div class="mb-6 flex items-center gap-2 bg-white/60 backdrop-blur px-4 py-2 rounded-2xl shadow-sm border border-slate-200">
            <span class="text-xs font-bold text-slate-500 mr-1">背景主題：</span>
            <button onclick="setTheme('sky')" class="w-6 h-6 rounded-full bg-sky-200 border-2 border-white shadow hover:scale-110 transition" title="晴空藍"></button>
            <button onclick="setTheme('emerald')" class="w-6 h-6 rounded-full bg-emerald-200 border-2 border-white shadow hover:scale-110 transition" title="森林綠"></button>
            <button onclick="setTheme('purple')" class="w-6 h-6 rounded-full bg-purple-200 border-2 border-white shadow hover:scale-110 transition" title="柔光紫"></button>
            <button onclick="setTheme('slate')" class="w-6 h-6 rounded-full bg-slate-300 border-2 border-white shadow hover:scale-110 transition" title="沉穩灰"></button>
        </div>

        <!-- 靜心主卡片 -->
        <div class="bg-white/90 backdrop-blur p-8 sm:p-12 rounded-3xl shadow-lg border border-slate-200 w-full max-w-xl flex flex-col items-center text-center relative overflow-hidden">
            
            <!-- 引導大字提示 -->
            <div id="instructionText" class="text-2xl sm:text-3xl font-extrabold text-indigo-600 mb-10 tracking-wide transition-all duration-300">
                準備好了嗎？跟著光球一起深呼吸
            </div>

            <!-- 視覺呼吸球容器 -->
            <div class="relative w-48 h-48 sm:w-56 sm:h-56 flex items-center justify-center mb-10">
                <!-- 光暈外圈 -->
                <div id="breatheBall" class="breathe-ball w-36 h-36 sm:w-44 sm:h-44 rounded-full flex items-center justify-center cursor-pointer" onclick="togglePause()">
                    <span id="ballText" class="text-white font-bold text-lg sm:text-xl drop-shadow-md select-none">吸氣</span>
                </div>
            </div>

            <!-- 操作按鈕與提示 -->
            <div class="flex flex-col items-center gap-3 w-full max-w-xs">
                <button id="pauseBtn" onclick="togglePause()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 px-6 rounded-xl text-base transition shadow-md active:scale-95">
                    ❚❚ 暫停呼吸引導
                </button>
                <p class="text-xs text-slate-400 mt-2">提示：點擊按鈕或呼吸球可隨時暫停或開始</p>
            </div>

        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-white/80 border-t border-slate-200 text-center py-4 text-slate-400 text-xs">
        國中特教課堂工具箱 | 02_4_calm-down.html
    </footer>

    <!-- 靜心與呼吸引導邏輯 -->
    <script>
        const ball = document.getElementById('breatheBall');
        const ballText = document.getElementById('ballText');
        const instructionText = document.getElementById('instructionText');
        const pauseBtn = document.getElementById('pauseBtn');
        
        let isPaused = false;
        let textInterval = null;

        // 呼吸循環文字同步計時器 (配合 8 秒 CSS 動畫：4秒吸氣、4秒吐氣)
        function startTextCycle() {
            // 初始化狀態
            updateTextCycle();
            // 每 8 秒一個完整循環
            textInterval = setInterval(updateTextCycle, 8000);
        }

        function updateTextCycle() {
            if (isPaused) return;
            
            // 0 ~ 4秒：吸氣
            ballText.textContent = "吸氣...";
            instructionText.textContent = "慢慢吸氣，感覺腹部隆起";
            instructionText.className = "text-2xl sm:text-3xl font-extrabold text-sky-600 mb-10 tracking-wide transition-all duration-300";

            // 4秒後：吐氣
            setTimeout(() => {
                if (!isPaused) {
                    ballText.textContent = "吐氣...";
                    instructionText.textContent = "緩緩吐氣，把肩膀放輕鬆";
                    instructionText.className = "text-2xl sm:text-3xl font-extrabold text-indigo-600 mb-10 tracking-wide transition-all duration-300";
                }
            }, 4000);
        }

        function togglePause() {
            isPaused = !isPaused;
            if (isPaused) {
                ball.classList.add('paused');
                clearInterval(textInterval);
                ballText.textContent = "暫停中";
                instructionText.textContent = "調整一下，準備好再繼續";
                instructionText.className = "text-2xl sm:text-3xl font-extrabold text-slate-500 mb-10 tracking-wide transition-all duration-300";
                pauseBtn.textContent = "▶ 繼續呼吸引導";
                pauseBtn.className = "w-full bg-slate-600 hover:bg-slate-700 active:bg-slate-800 text-white font-bold py-3 px-6 rounded-xl text-base transition shadow-md active:scale-95";
            } else {
                ball.classList.remove('paused');
                pauseBtn.textContent = "❚❚ 暫停呼吸引導";
                pauseBtn.className = "w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 px-6 rounded-xl text-base transition shadow-md active:scale-95";
                updateTextCycle();
                textInterval = setInterval(updateTextCycle, 8000);
            }
        }

        // 背景主題切換
        function setTheme(theme) {
            const body = document.getElementById('pageBg');
            if (theme === 'sky') {
                body.className = "bg-sky-50 min-h-screen flex flex-col justify-between text-slate-800 transition-colors duration-700";
            } else if (theme === 'emerald') {
                body.className = "bg-emerald-50 min-h-screen flex flex-col justify-between text-slate-800 transition-colors duration-700";
            } else if (theme === 'purple') {
                body.className = "bg-purple-50 min-h-screen flex flex-col justify-between text-slate-800 transition-colors duration-700";
            } else if (theme === 'slate') {
                body.className = "bg-slate-200 min-h-screen flex flex-col justify-between text-slate-800 transition-colors duration-700";
            }
        }

        // 全螢幕切換
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // 啟動呼吸循環
        startTextCycle();
    </script>
</body>
</html>
