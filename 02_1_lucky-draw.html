<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小教室座位抽籤板 | 老師的教學百寶箱</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .seat-card {
            transition: all 0.15s ease-in-out;
        }
        /* 跑馬燈移動時的高亮狀態 (橘黃色) */
        .seat-active {
            background-color: #f59e0b !important;
            color: white !important;
            transform: scale(1.08);
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.6);
            z-index: 30;
            border-color: #d97706 !important;
        }
        .seat-active span {
            color: white !important;
        }
        /* 最終中獎的特殊顏色 (翡翠綠) */
        .seat-winner {
            background-color: #10b981 !important;
            color: white !important;
            transform: scale(1.12);
            box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.7);
            z-index: 40;
            border-color: #059669 !important;
        }
        .seat-winner span {
            color: white !important;
        }
        /* 已被排除的灰色狀態 */
        .seat-disabled {
            background-color: #e2e8f0 !important;
            color: #94a3b8 !important;
            border-color: #cbd5e1 !important;
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between text-slate-800">

    <!-- 頂部快速工具列 -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shadow-sm">
        <a href="./index.html" class="inline-flex items-center gap-2 text-indigo-600 font-bold hover:text-indigo-800 transition active:scale-95 text-sm">
            <span>🏠 返回百寶箱首頁</span>
        </a>
        <h1 class="text-base font-bold text-slate-700 hidden sm:block">小教室 8 位置座位抽籤板</h1>
        <button onclick="toggleFullScreen()" class="bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 font-medium px-3 py-1.5 rounded-lg text-xs transition active:scale-95 border border-indigo-200">
            🖥️ 全螢幕
        </button>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto w-full p-4 sm:p-6 flex-grow flex flex-col items-center justify-center">

        <!-- 教室方向定位：講台與老師位置 -->
        <div class="w-full max-w-2xl bg-slate-800 text-slate-200 py-2.5 px-6 rounded-2xl mb-8 shadow-md flex items-center justify-center gap-3 border-2 border-slate-700">
            <span class="text-xl">🧑‍🏫</span>
            <span class="font-bold tracking-widest text-sm sm:text-base">【 黑板 / 講台方向（老師位置） 】</span>
        </div>

        <!-- 八個座位佈局區 (兩排橫排，一排4個) -->
        <div class="w-full max-w-2xl grid grid-cols-4 gap-3 sm:gap-5 mb-8">
            
            <!-- 第一排座位 (1 ~ 4號) -->
            <div id="seat-1" class="seat-card bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center shadow-sm relative min-h-[100px] sm:min-h-[120px]">
                <span class="text-xs text-slate-400 font-bold mb-1">第一排</span>
                <span class="seat-num text-2xl sm:text-4xl font-extrabold text-slate-400">1</span>
                <span class="winner-tag hidden absolute -top-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">中獎</span>
            </div>
            <div id="seat-2" class="seat-card bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center shadow-sm relative min-h-[100px] sm:min-h-[120px]">
                <span class="text-xs text-slate-400 font-bold mb-1">第一排</span>
                <span class="seat-num text-2xl sm:text-4xl font-extrabold text-slate-400">2</span>
                <span class="winner-tag hidden absolute -top-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">中獎</span>
            </div>
            <div id="seat-3" class="seat-card bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center shadow-sm relative min-h-[100px] sm:min-h-[120px]">
                <span class="text-xs text-slate-400 font-bold mb-1">第一排</span>
                <span class="seat-num text-2xl sm:text-4xl font-extrabold text-slate-400">3</span>
                <span class="winner-tag hidden absolute -top-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">中獎</span>
            </div>
            <div id="seat-4" class="seat-card bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center shadow-sm relative min-h-[100px] sm:min-h-[120px]">
                <span class="text-xs text-slate-400 font-bold mb-1">第一排</span>
                <span class="seat-num text-2xl sm:text-4xl font-extrabold text-slate-400">4</span>
                <span class="winner-tag hidden absolute -top-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">中獎</span>
            </div>

            <!-- 第二排座位 (5 ~ 8號) -->
            <div id="seat-5" class="seat-card bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center shadow-sm relative min-h-[100px] sm:min-h-[120px]">
                <span class="text-xs text-slate-400 font-bold mb-1">第二排</span>
                <span class="seat-num text-2xl sm:text-4xl font-extrabold text-slate-400">5</span>
                <span class="winner-tag hidden absolute -top-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">中獎</span>
            </div>
            <div id="seat-6" class="seat-card bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center shadow-sm relative min-h-[100px] sm:min-h-[120px]">
                <span class="text-xs text-slate-400 font-bold mb-1">第二排</span>
                <span class="seat-num text-2xl sm:text-4xl font-extrabold text-slate-400">6</span>
                <span class="winner-tag hidden absolute -top-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">中獎</span>
            </div>
            <div id="seat-7" class="seat-card bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center shadow-sm relative min-h-[100px] sm:min-h-[120px]">
                <span class="text-xs text-slate-400 font-bold mb-1">第二排</span>
                <span class="seat-num text-2xl sm:text-4xl font-extrabold text-slate-400">7</span>
                <span class="winner-tag hidden absolute -top-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">中獎</span>
            </div>
            <div id="seat-8" class="seat-card bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center shadow-sm relative min-h-[100px] sm:min-h-[120px]">
                <span class="text-xs text-slate-400 font-bold mb-1">第二排</span>
                <span class="seat-num text-2xl sm:text-4xl font-extrabold text-slate-400">8</span>
                <span class="winner-tag hidden absolute -top-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">中獎</span>
            </div>

        </div>

        <!-- 狀態與提示資訊 -->
        <div id="statusMessage" class="text-slate-700 text-base sm:text-lg font-bold mb-6 h-8 flex items-center justify-center">
            準備就緒，請點擊按鈕開始抽籤！
        </div>

        <!-- 控制面板 -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 w-full max-w-xl flex flex-col items-center gap-4">
            
            <!-- 選項勾選 -->
            <label class="inline-flex items-center gap-2 cursor-pointer select-none">
                <input type="checkbox" id="excludeDrawn" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                <span class="text-xs sm:text-sm text-slate-700 font-medium">排除已被抽中的座位（不重複抽取）</span>
            </label>

            <!-- 操作按鈕組 -->
            <div class="flex items-center gap-3 w-full">
                <!-- 抽籤按鈕 -->
                <button id="drawBtn" onclick="startDraw()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 px-6 rounded-xl text-base sm:text-lg transition shadow-md active:scale-95">
                    🎲 開始抽籤
                </button>
                <!-- 重置按鈕 -->
                <button onclick="resetDraw()" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-bold py-3 px-5 rounded-xl text-sm sm:text-base transition active:scale-95">
                    🔄 重置
                </button>
            </div>

        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 text-center py-4 text-slate-400 text-xs text-slate-400">
        國中特教課堂工具箱 | 02_1_lucky-draw.html
    </footer>

    <!-- 重新編寫且穩定可靠的抽籤邏輯 -->
    <script>
        const totalSeats = 8;
        let drawnSeats = []; // 儲存已被抽中的座位編號
        let isDrawing = false;

        // Web Audio 音效產生器
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(freq, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // 忽略音效錯誤，確保主程式不受影響
            }
        }

        function playWinSound() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    setTimeout(() => playBeep(freq, 0.15), idx * 100);
                });
            } catch (e) {}
        }

        // 延遲輔助函數
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function startDraw() {
            if (isDrawing) return;

            const excludeChecked = document.getElementById('excludeDrawn').checked;

            // 收集尚未被排除的可抽座位
            let availableSeats = [];
            for (let i = 1; i <= totalSeats; i++) {
                if (!excludeChecked || !drawnSeats.includes(i)) {
                    availableSeats.push(i);
                }
            }

            if (availableSeats.length === 0) {
                document.getElementById('statusMessage').innerHTML = '<span class="text-rose-500">⚠️ 所有座位皆已被抽過，請點擊重置！</span>';
                return;
            }

            isDrawing = true;
            const btn = document.getElementById('drawBtn');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('statusMessage').textContent = '🎲 幸運抽籤中，緊張刺激...';

            // 決定最終中獎號碼
            const winningSeat = availableSeats[Math.floor(Math.random() * availableSeats.length)];

            // 清除上一輪的非保留狀態
            clearHighlights(excludeChecked);

            // 跑馬燈速度陣列：從慢(250ms) -> 快(50ms) -> 慢(350ms)
            let speeds = [250, 220, 180, 140, 100, 75, 55, 50, 50, 65, 90, 130, 190, 280, 380];
            let currentSeat = Math.floor(Math.random() * totalSeats) + 1;

            // 確保跑足夠的步數後停在 winningSeat
            let totalSteps = speeds.length;
            for (let step = 0; step < totalSteps; step++) {
                // 如果勾選排除，跳過已經被抽掉的座位
                if (excludeChecked) {
                    while (drawnSeats.includes(currentSeat)) {
                        currentSeat = (currentSeat % totalSeats) + 1;
                    }
                }

                // 如果是最後一步，強制停在中獎號碼
                if (step === totalSteps - 1) {
                    currentSeat = winningSeat;
                }

                // 移除全部人的 active
                removeActiveForAll();

                // 點亮當前座位
                const el = document.getElementById(`seat-${currentSeat}`);
                if (!el.classList.contains('seat-winner')) {
                    el.classList.add('seat-active');
                    playBeep(440, 0.04);
                }

                await sleep(speeds[step]);
                currentSeat = (currentSeat % totalSeats) + 1;
            }

            // 動畫結束，顯示中獎結果
            removeActiveForAll();
            const winEl = document.getElementById(`seat-${winningSeat}`);
            winEl.classList.add('seat-winner');
            winEl.querySelector('.winner-tag').classList.remove('hidden');

            playWinSound();
            document.getElementById('statusMessage').innerHTML = `🎉 恭喜 <span class="text-emerald-600 font-extrabold text-xl px-1">${winningSeat} 號</span> 座位的同學中獎！`;

            if (excludeChecked) {
                drawnSeats.push(winningSeat);
                // 稍後轉為灰色已抽過狀態
                setTimeout(() => {
                    winEl.classList.remove('seat-winner');
                    winEl.classList.add('seat-disabled');
                }, 2000);
            }

            isDrawing = false;
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function removeActiveForAll() {
            for (let i = 1; i <= totalSeats; i++) {
                document.getElementById(`seat-${i}`).classList.remove('seat-active');
            }
        }

        function clearHighlights(excludeChecked) {
            for (let i = 1; i <= totalSeats; i++) {
                const el = document.getElementById(`seat-${i}`);
                el.classList.remove('seat-active');
                if (!excludeChecked) {
                    el.classList.remove('seat-winner');
                    el.querySelector('.winner-tag').classList.add('hidden');
                }
            }
        }

        // 重置所有狀態
        function resetDraw() {
            if (isDrawing) return;
            drawnSeats = [];
            for (let i = 1; i <= totalSeats; i++) {
                const el = document.getElementById(`seat-${i}`);
                el.className = 'seat-card bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center shadow-sm relative min-h-[100px] sm:min-h-[120px]';
                el.querySelector('.winner-tag').classList.add('hidden');
            }
            document.getElementById('statusMessage').textContent = '已重置！準備就緒，請點擊按鈕開始抽籤。';
        }

        // 全螢幕切換
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
