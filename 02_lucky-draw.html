<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小教室座位抽籤板 | 老師的教學百寶箱</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .seat-card {
            transition: all 0.2s ease;
        }
        /* 被跑馬燈燈號巡迴時的動態效果 */
        .seat-active {
            background-color: #f59e0b !important; /* 鮮黃橙色 */
            color: white !important;
            transform: scale(1.08);
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.5);
            z-index: 10;
        }
        /* 最終被抽中的特殊亮色 */
        .seat-winner {
            background-color: #10b981 !important; /* 翡翠綠色 */
            color: white !important;
            transform: scale(1.12);
            box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.6);
            z-index: 20;
            animation: pulse-winner 0.8s infinite alternate;
        }
        @keyframes pulse-winner {
            0% { transform: scale(1.1); }
            100% { transform: scale(1.16); }
        }
        /* 已被抽中排除的灰色狀態 */
        .seat-disabled {
            background-color: #e2e8f0 !important;
            color: #94a3b8 !important;
            border-color: #cbd5e1 !important;
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between text-slate-800">

    <!-- 頂部快速工具列 -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shadow-sm">

            <span>🏠 返回工具百寶箱</span>

        <h1 class="text-base font-bold text-slate-700 hidden sm:block">小教室 8 位置座位抽籤板</h1>

            </div>
            <div id="seat-2" class="seat-card bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center shadow-sm relative min-h-[100px] sm:min-h-[120px]">

            </div>
            <div id="seat-6" class="seat-card bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center shadow-sm relative min-h-[100px] sm:min-h-[120px]">
                <span class="text-xs text-slate-400 font-bold mb-1">第二排</span>
                <span class="text-2xl sm:text-4xl font-extrabold text-slate-300">6</span>
                <span class="winner-tag hidden absolute -top-2 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">中獎</span>
            </div>
            <div id="seat-7" class="seat-card bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center shadow-sm relative min-h-[100px] sm:min-h-[120px]">
                <span class="text-xs text-slate-400 font-bold mb-1">第二排</span>
                <span class="text-2xl sm:text-4xl font-extrabold text-slate-300">7</span>
                <span class="winner-tag hidden absolute -top-2 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">中獎</span>
            </div>
            <div id="seat-8" class="seat-card bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center shadow-sm relative min-h-[100px] sm:min-h-[120px]">
                <span class="text-xs text-slate-400 font-bold mb-1">第二排</span>
                <span class="text-2xl sm:text-4xl font-extrabold text-slate-300">8</span>
                <span class="winner-tag hidden absolute -top-2 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">中獎</span>
            </div>

        </div>

        <!-- 狀態與提示資訊 -->
        <div id="statusMessage" class="text-slate-600 text-base sm:text-lg font-bold mb-6 h-8 flex items-center justify-center">
            準備就緒，請點擊按鈕開始抽籤！
        </div>

        <!-- 控制面板 -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 w-full max-w-xl flex flex-col items-center gap-4">
            
            <!-- 選項勾選 -->
            <label class="inline-flex items-center gap-2 cursor-pointer select-none">
                <input type="checkbox" id="excludeDrawn" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                <span class="text-xs sm:text-sm text-slate-700 font-medium">排除已被抽中的座位（不重複抽取）</span>
            </label>

            <!-- 操作按鈕組 -->
            <div class="flex items-center gap-3 w-full">
                <!-- 抽籤按鈕 -->
                <button id="drawBtn" onclick="startDraw()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 px-6 rounded-xl text-base sm:text-lg transition shadow-md active:scale-95">
                    🎲 開始抽籤
                </button>
                <!-- 重置按鈕 -->
                <button onclick="resetDraw()" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-bold py-3 px-5 rounded-xl text-sm sm:text-base transition active:scale-95">
                    🔄 重置
                </button>
            </div>

        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 text-center py-4 text-slate-400 text-xs">
        國中特教課堂工具箱 | 02_lucky-draw.html
    </footer>

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
