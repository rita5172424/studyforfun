<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感恩回饋區 | 老師的教學百寶箱</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-rose-50/40 h-screen overflow-hidden flex flex-col justify-between text-slate-800 select-none">

    <!-- 頂部快速工具列 -->
    <header class="bg-white/90 border-b border-rose-100 px-6 py-2.5 flex justify-between items-center shadow-xs shrink-0">
        <a href="./index.html" class="inline-flex items-center gap-2 text-rose-700 font-extrabold hover:text-rose-900 transition active:scale-95 text-base">
            <span>🏠 返回百寶箱首頁</span>
        </a>
        <h1 class="text-lg font-black text-slate-700 hidden sm:block">💖 感恩回饋時間</h1>
        <button onclick="toggleFullScreen()" class="bg-rose-50 hover:bg-rose-100 active:bg-rose-200 text-rose-700 font-bold px-3 py-1 rounded-lg text-xs transition active:scale-95 border border-rose-200">
            🖥️ 全螢幕
        </button>
    </header>

    <!-- 主要內容區 (一頁式免滑動) -->
    <main class="max-w-5xl mx-auto w-full px-4 py-3 flex-grow flex flex-col justify-between overflow-hidden">

        <!-- 頁面標題 -->
        <div class="text-center my-1 shrink-0">
            <h2 class="text-3xl sm:text-4xl font-black text-slate-800 tracking-tight">💖 感恩回饋時間</h2>
            <p class="text-slate-600 text-sm font-bold mt-1">專注現在能做的事，發現生活中的微小幸福。</p>
        </div>

        <!-- 核心示範句型與靈感按鈕對齊區 -->
        <div class="bg-white/90 p-5 rounded-3xl shadow-sm border border-rose-100 w-full flex flex-col justify-center">
            
            <!-- 核心表達句型 -->
            <div class="bg-rose-50/60 p-4 rounded-2xl border border-rose-100/80 text-xl sm:text-2xl font-black text-slate-800 text-center tracking-wide leading-relaxed shadow-xs mb-4">
                我感恩 <span class="text-rose-600 underline decoration-rose-300 underline-offset-4">______(對象)</span>，因為 <span class="text-indigo-600 underline decoration-indigo-300 underline-offset-4">______(行為描述)</span>，讓我 <span class="text-emerald-600 underline decoration-emerald-300 underline-offset-4">______(感受)</span>。
            </div>

            <!-- 對齊行為描述與感受的靈感按鈕區 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- 行為描述靈感區 (揉合莫蘭迪藍) -->
                <div class="flex flex-col">
                    <span class="text-sm font-extrabold text-slate-600 mb-1.5 flex items-center gap-1">💡 行為描述靈感：</span>
                    <div class="flex gap-2 mb-2">
                        <button id="btnOther" onclick="getRandomKeywords('otherBehavior')" class="flex-1 bg-indigo-500/80 hover:bg-indigo-600 active:bg-indigo-700 text-white font-bold py-2 px-2 rounded-xl text-xs sm:text-sm transition shadow-xs active:scale-95">
                            👥 他人行為
                        </button>
                        <button id="btnSelf" onclick="getRandomKeywords('selfBehavior')" class="flex-1 bg-indigo-500/80 hover:bg-indigo-600 active:bg-indigo-700 text-white font-bold py-2 px-2 rounded-xl text-xs sm:text-sm transition shadow-xs active:scale-95">
                            🙋‍♂️ 自身行為
                        </button>
                    </div>
                    <!-- 行為關鍵字卡片位置 -->
                    <div id="behaviorKeywordBox" class="h-[76px] bg-indigo-50/30 p-2 rounded-xl border border-indigo-100 flex flex-wrap gap-2 items-center justify-center text-sm font-bold text-slate-700">
                        點擊上方按鈕，產生行為提示！
                    </div>
                </div>

                <!-- 感受形容詞靈感區 (揉合莫蘭迪綠) -->
                <div class="flex flex-col">
                    <span class="text-sm font-extrabold text-slate-600 mb-1.5 flex items-center gap-1">💡 感受形容詞靈感：</span>
                    <div class="mb-2">
                        <button id="btnFeeling" onclick="getRandomKeywords('feelings')" class="w-full bg-emerald-600/80 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-2 px-2 rounded-xl text-xs sm:text-sm transition shadow-xs active:scale-95">
                            💖 感受形容詞
                        </button>
                    </div>
                    <!-- 感受關鍵字卡片位置 -->
                    <div id="feelingKeywordBox" class="h-[76px] bg-emerald-50/30 p-2 rounded-xl border border-emerald-100 flex flex-wrap gap-2 items-center justify-center text-sm font-bold text-slate-700">
                        點擊上方按鈕，產生感受提示！
                    </div>
                </div>

            </div>
        </div>

        <!-- 每日引導思考題區 -->
        <div class="bg-white/90 p-4 sm:p-5 rounded-3xl shadow-sm border border-rose-100 w-full my-1">
            <div class="flex justify-between items-center mb-2.5">
                <h3 class="font-extrabold text-slate-800 text-base sm:text-lg flex items-center gap-2">
                    <span>✨ 今日引導思考題</span>
                </h3>
                <button onclick="loadRandomQuestions()" class="text-xs sm:text-sm text-rose-600 font-bold hover:underline active:scale-95">🔄 換一組題目</button>
            </div>
            <div id="questionContainer" class="space-y-2 text-sm sm:text-base font-bold text-slate-700">
                <!-- 隨機題目填入區 -->
            </div>
        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-white/80 border-t border-rose-100 text-center py-2 text-slate-400 text-xs shrink-0">
        國中特教課堂工具箱 | 03_1_gratitude-share.html
    </footer>
