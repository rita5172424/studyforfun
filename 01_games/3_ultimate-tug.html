<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>終極拔河大對決</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFCF6;
    --ink: #3E3A39;
    --coral: #F2A497;
    --yellow: #F6D27A;
    --blue: #A8D3E6;
    --green: #B9DAA5;
    --line: 3px solid var(--ink);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5; overflow: hidden;
  }
  .app { height: 100dvh; display: flex; flex-direction: column; gap: 10px; padding: 10px; }

  /* 按鈕 */
  .btn {
    font: inherit; color: var(--ink); background: var(--paper);
    border: var(--line); border-radius: 999px; padding: 4px 16px;
    cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap;
    transition: transform .12s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible, button:focus-visible, textarea:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
  .btn.coral { background: var(--coral); }
  .btn.yellow { background: var(--yellow); }
  .btn.blue { background: var(--blue); }
  .btn.green { background: var(--green); }
  #boldBtn[aria-pressed="true"] { background: var(--yellow); }

  /* 頂部列 */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .title { font-size: clamp(20px, 3vw, 30px); letter-spacing: .1em; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .timer {
    border: var(--line); border-radius: 999px; background: var(--paper);
    padding: 4px 16px; min-width: 96px; text-align: center; font-variant-numeric: tabular-nums;
  }

  /* 拔河舞台 */
  .stage {
    border: var(--line); border-radius: 28px; background: var(--paper);
    padding: 4px 10px; flex: 0 1 auto; min-height: 0; display: flex; justify-content: center;
  }
  .stage svg { width: 100%; height: auto; max-height: 27vh; display: block; overflow: visible; }
  #ropeGroup { transition: transform .8s ease-in-out; }
  .lean { transform-origin: 0 0; animation: lean 1.1s ease-in-out infinite alternate; }
  @keyframes lean { from { transform: rotate(-14deg); } to { transform: rotate(-19deg); } }
  .cloud { animation: drift 14s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }

  /* 兩隊面板 */
  .teams { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .team {
    border: var(--line); border-radius: 28px; background: var(--paper);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .team.shake { animation: shake .35s; }
  @keyframes shake { 20% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 80% { transform: translateX(-4px); } }
  .team.ok .thead { animation: okflash .45s; }
  @keyframes okflash { 0% { background: var(--green); } 100% { background: var(--tc); } }
  .thead {
    background: var(--tc); border-bottom: var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 16px; font-size: clamp(14px, 1.8vw, 20px);
  }
  .chip { font-size: clamp(18px, 2.4vw, 26px); letter-spacing: .1em; }
  .tbody { position: relative; flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; }
  .ask { display: flex; flex-direction: column; gap: 14px; }
  .q { margin: 0; font-size: clamp(18px, 2.6vw, 30px); line-height: 1.5; overflow-wrap: anywhere; }
  .opts { display: grid; gap: 10px; }
  .opt {
    font: inherit; color: var(--ink); text-align: left; cursor: pointer;
    background: #fff; border: var(--line); border-radius: 22px;
    min-height: 56px; padding: 8px 14px; display: flex; align-items: center; gap: 12px;
    font-size: clamp(16px, 2.2vw, 26px); touch-action: manipulation;
  }
  .opt:hover:not(:disabled) { background: var(--tc); }
  .opt:active:not(:disabled) { transform: scale(.98); }
  .opt:disabled { cursor: not-allowed; opacity: .55; }
  .opt .l {
    flex: none; width: 1.8em; height: 1.8em; border-radius: 50%; border: var(--line);
    background: var(--tc); display: inline-flex; align-items: center; justify-content: center;
  }
  .opt .t { overflow-wrap: anywhere; }
  body.bold .q, body.bold .opt .t, body.bold .opt .l { font-weight: 700; -webkit-text-stroke: .7px var(--ink); }

  .lock {
    position: absolute; inset: 10px; border: var(--line); border-radius: 24px;
    background: var(--coral); display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 4px; padding: 12px; z-index: 2;
  }
  .lock .n { font-size: clamp(48px, 9vw, 96px); line-height: 1; }
  .lock p { margin: 0; font-size: clamp(14px, 1.8vw, 20px); }
  .wait, .idle { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; font-size: clamp(16px, 2.2vw, 24px); }
  .wait svg { width: clamp(80px, 14vw, 150px); height: auto; animation: hop 1s ease-in-out infinite; }
  @keyframes hop { 50% { transform: translateY(-10px); } }

  /* 彈跳視窗 */
  dialog {
    border: var(--line); border-radius: 28px; background: var(--paper); color: var(--ink);
    width: min(680px, 94vw); padding: 20px 22px; font-family: inherit;
  }
  dialog::backdrop { background: rgba(62, 58, 57, .4); }
  dialog h2 { margin: 0 0 6px; font-weight: 400; font-size: 26px; letter-spacing: .1em; }
  dialog p { margin: 4px 0 8px; font-size: 14px; }
  dialog textarea {
    width: 100%; min-height: 220px; resize: vertical; font: inherit; font-size: 15px; color: var(--ink);
    background: #fff; border: var(--line); border-radius: 18px; padding: 10px 14px;
  }
  .preset-row { display: flex; align-items: center; gap: 10px; margin: 6px 0 8px; flex-wrap: wrap; }
  .preset-row select {
    font: inherit; color: var(--ink); background: #fff; border: var(--line); border-radius: 999px;
    padding: 4px 14px; max-width: 100%;
  }
  .sc .note { font-size: 13px; }
  .dlg-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
  .err { color: #B4473A; font-size: 14px; min-height: 1.5em; margin: 8px 0 0; white-space: pre-line; }

  /* 提示與結果 */
  .toast {
    position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%);
    border: var(--line); border-radius: 28px; background: var(--yellow);
    padding: 14px 32px; font-size: clamp(22px, 4vw, 40px); z-index: 20; pointer-events: none;
    animation: pop .4s ease-out;
  }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.6); opacity: 0; } }
  .overlay {
    position: fixed; inset: 0; background: var(--paper); z-index: 30;
    display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto;
  }
  .result { position: relative; z-index: 2; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 760px; width: 100%; }
  .result h2 { margin: 0; font-weight: 400; font-size: clamp(30px, 6vw, 56px); letter-spacing: .1em; }
  .scores { display: flex; gap: 14px; justify-content: center; align-items: flex-end; width: 100%; }
  .sc {
    flex: 1; max-width: 280px; border: var(--line); border-radius: 28px; background: var(--paper);
    padding: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .sc.win { background: var(--tc); }
  .sc .nm { font-size: clamp(16px, 2.4vw, 24px); }
  .sc .pt { font-size: clamp(32px, 7vw, 64px); line-height: 1.1; }
  .sc svg { width: clamp(70px, 14vw, 130px); height: auto; }
  .sc.win svg { animation: jump .7s ease-in-out infinite; }
  @keyframes jump { 50% { transform: translateY(-16px); } }
  .result .meta { font-size: 16px; }
  .confetti { position: fixed; top: -20px; width: 12px; height: 16px; border: 2px solid var(--ink); border-radius: 4px; z-index: 1; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(112vh) rotate(540deg); } }

  @media (max-aspect-ratio: 1/1) and (max-width: 700px) {
    .teams { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .stage svg { max-height: 18vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lean, .cloud, .wait svg, .sc.win svg, .confetti { animation: none; }
  }
</style>
</head>
<body class="">
<div class="app">
  <header class="bar">
    <a class="btn yellow" href="index.html">回首頁</a>
    <div class="title">終極拔河大對決</div>
    <div class="tools">
      <div class="timer" id="timer" role="timer">00:00</div>
      <button class="btn blue" id="bankBtn" type="button">題庫</button>
      <button class="btn" id="boldBtn" type="button" aria-pressed="false">字體加粗</button>
      <button class="btn green" id="soundBtn" type="button">音效：開</button>
      <button class="btn coral" id="fsBtn" type="button">全螢幕</button>
    </div>
  </header>

  <section class="stage" aria-label="拔河畫面">
    <svg id="stageSvg" viewBox="-40 0 880 200" role="img" aria-label="藍隊與黃隊正在拔河"></svg>
  </section>

  <main class="teams">
    <section class="team" data-t="0" style="--tc:#A8D3E6">
      <div class="thead"><span class="chip">藍隊</span><span class="phase"></span><span class="qt"></span></div>
      <div class="tbody">
        <div class="ask" hidden><p class="q"></p><div class="opts"></div></div>
        <div class="lock" hidden><div class="n">3</div><p></p></div>
        <div class="wait" hidden><div class="fig"></div><p></p></div>
        <div class="idle">按右上角「題庫」開始</div>
      </div>
    </section>
    <section class="team" data-t="1" style="--tc:#F6D27A">
      <div class="thead"><span class="chip">黃隊</span><span class="phase"></span><span class="qt"></span></div>
      <div class="tbody">
        <div class="ask" hidden><p class="q"></p><div class="opts"></div></div>
        <div class="lock" hidden><div class="n">3</div><p></p></div>
        <div class="wait" hidden><div class="fig"></div><p></p></div>
        <div class="idle">按右上角「題庫」開始</div>
      </div>
    </section>
  </main>
</div>

<dialog id="bankDlg">
  <h2>輸入題庫</h2>
  <div class="preset-row">
    <label for="presetSel">歷史題庫（預設題庫）</label>
    <select id="presetSel"></select>
  </div>
  <p>每行一題，格式：題目／[選項1][選項2][[正確選項]]<br>正確答案用雙層括號 [[ ]]，全形或半形皆可，空格不影響；選項 2～6 個，出題時選項順序會自動隨機。<br>輸入內容只會當作題目資料使用。</p>
  <textarea id="bankInput" spellcheck="false"></textarea>
  <p class="err" id="bankErr" role="alert"></p>
  <div class="dlg-actions">
    <button class="btn" id="bankCancel" type="button">取消</button>
    <button class="btn coral" id="bankStart" type="button">開始</button>
  </div>
</dialog>

<div class="overlay" id="result" hidden>
  <div class="result">
    <svg id="trophy" width="110" height="110" viewBox="0 0 110 110" aria-hidden="true">
      <path d="M30 14h50v28c0 17-11 28-25 28S30 59 30 42z" fill="#F6D27A" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      <path d="M30 22H14c0 16 6 26 18 28M80 22h16c0 16-6 26-18 28" fill="none" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
      <path d="M55 70v16M36 96h38" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
      <rect x="38" y="86" width="34" height="12" rx="5" fill="#F2A497" stroke="#3E3A39" stroke-width="3"/>
      <path d="M55 24l4 9 10 1-7.5 6.500 2.500 9.500-9-5-9 5 2.500-9.500L41 34l10-1z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="2.500" stroke-linejoin="round"/>
    </svg>
    <h2 id="resTitle"></h2>
    <div class="scores" id="resScores"></div>
    <div class="meta" id="resMeta"></div>
    <div class="tools" style="justify-content:center">
      <button class="btn coral" id="againBtn" type="button">再來一局</button>
      <button class="btn blue" id="newBankBtn" type="button">換題庫</button>
      <a class="btn yellow" href="index.html">回首頁</a>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================================
   * 【預設題庫區｜擴充指引】
   * 想新增預設題庫時，請只改這一區：
   *  1. 複製下面任一個 { id: ..., name: ..., text: `...` } 區塊，
   *     貼在最後一個區塊後面，並在前一個區塊結尾補上逗號 ,
   *  2. id：英文或數字，不可與其他題庫重複。
   *  3. name：顯示在「歷史題庫」下拉選單中的名稱。
   *  4. text：用反引號 ` ` 包住，每行一題，格式如下：
   *       題目／[選項1][選項2][[正確選項]]
   *     - 正確答案用雙層括號 [[ ]]，其餘用單層 [ ]（全形［］也可以）
   *     - 括號之間有空格不影響；選項 2～6 個；每題只能有 1 個正確答案
   *     - text 內不要出現反引號 ` 或 ${
   *  5. 出題時選項順序會自動隨機，不需要自己打亂。
   *  6. 陣列第一個題庫會是開啟頁面時預設載入的題庫。
   * ===================================================================== */
  var PRESET_BANKS = [
    {
      id: 'class-rules',
      name: '課堂參與原則',
      text: `進教室上課的第一個步驟，學生應該先做什麼？／[找到位置坐下發呆][先去聊天][[加分與繳交聯絡簿]]
在這間教室裡，我們看待彼此的主要關係是什麼？／[競爭對手][陌生人][[合作夥伴]]
課堂上如果看到同學答不出問題，適當的做法是什麼？／[嘲笑他][立刻幫他搶答][[輕聲引導與給予鼓勵]]
本課堂最核心鼓勵的兩種學習態度與氛圍是什麼？／[競爭與速度][安靜與服從][[友善與思考]]
上課期間，哪一種展現是我們所鼓勵的「積極參與課堂」？／[看旁邊同學在做什麼][低頭做自己的事情][[主動思考、舉手發表與專心聆聽]]
下課離開前，要先做什麼？／[去上廁所][找同學聊天][[排隊向老師報分數]]
當小組進行討論或合作任務時，應該如何互動？／[只顧著做自己的事][把工作全部推給組長][[互相傾聽、交流想法並共同完成]]
當自己的意見與其他同學不同時，怎樣才是「友善」的表達方式？／[直接罵對方講得很爛][強迫大家一定要聽自己的][[尊重聆聽，並溫和提出自己的看法]]
課堂上遇到不懂的問題或思考遇到瓶頸時，該怎麼辦？／[放棄不思考][假裝自己全部都會][[勇於提問並嘗試從不同角度思考]]
關於課堂上的「回答錯誤」，我們應該如何看待？／[非常丟臉，不容出現][應該要懲罰回答錯的人][[這在思考與學習過程中是很正常的練習]]`
    },
    {
      id: 'chinese-mix',
      name: '國語綜合範例',
      text: `「細細一線與整座天空拔河」使用了什麼修辭？／[映襯][排比][[擬人]]
「床前明月光」的下一句是什麼？／[[疑是地上霜]][低頭思故鄉][舉頭望明月]
「畫蛇添足」比喻什麼？／[[多此一舉]][技藝高超][膽小怕事]
下列哪一個詞語是「謙虛」的反義詞？／[誠懇][[驕傲]][勤勞]
「春眠不覺曉」的作者是誰？／[李白][杜甫][[孟浩然]]
「一目十行」形容什麼？／[[看書速度很快]][眼睛不好][喜歡畫畫]`
    }
    // ↑ 在這裡新增下一個題庫（記得上一個 } 後面要有逗號）
  ];

  var PENALTY_MISSED_Q = 7, PENALTY_POINTS = 0.5; // 單回合有失誤的題數 ≥ 7 題，額外扣 0.5 分

  var INK = '#3E3A39', SKIN = '#FFE3CF';
  var TEAMS = [
    { name: '藍隊', color: '#A8D3E6' },
    { name: '黃隊', color: '#F6D27A' }
  ];
  var LOCK_MS = 3000, LIMIT_MS = 180000;

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var timerEl = $('#timer');
  var dlg = $('#bankDlg'), bankInput = $('#bankInput'), bankErr = $('#bankErr');
  var resultEl = $('#result');
  var ui = [];
  [0, 1].forEach(function (i) {
    var el = document.querySelector('.team[data-t="' + i + '"]');
    ui.push({
      root: el, phase: $('.phase', el), qt: $('.qt', el),
      ask: $('.ask', el), q: $('.q', el), opts: $('.opts', el),
      lock: $('.lock', el), lockN: $('.lock .n', el), lockMsg: $('.lock p', el),
      wait: $('.wait', el), fig: $('.fig', el), waitMsg: $('.wait p', el), idle: $('.idle', el)
    });
  });

  var game = null, bank = [], tickId = null, ropeId = null;

  /* ---------- 工具 ---------- */
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
  function numText(n) { return n % 1 ? n.toFixed(1) : String(n); }

  /* ---------- 音效 ---------- */
  var actx = null, soundOn = true;
  function ensureAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function tone(freq, at, dur, type, vol) {
    if (!soundOn || !actx) return;
    var o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + at;
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  var sfx = {
    ok: function () { tone(784, 0, 0.12, 'triangle'); tone(1047, 0.1, 0.2, 'triangle'); },
    bad: function () { tone(180, 0, 0.25, 'sawtooth', 0.12); tone(140, 0.12, 0.25, 'sawtooth', 0.12); },
    wait: function () { tone(660, 0, 0.15, 'sine'); tone(880, 0.12, 0.2, 'sine'); },
    review: function () { [523, 659, 784].forEach(function (f, i) { tone(f, i * 0.1, 0.18, 'triangle'); }); },
    win: function () {
      var seq = [523, 659, 784, 1047, 784, 1047, 1319];
      seq.forEach(function (f, i) { tone(f, i * 0.16, 0.3, 'triangle', 0.2); tone(f / 2, i * 0.16, 0.3, 'sine', 0.1); });
    }
  };
  $('#soundBtn').addEventListener('click', function () {
    soundOn = !soundOn; this.textContent = '音效：' + (soundOn ? '開' : '關');
    if (soundOn) { ensureAudio(); sfx.ok(); }
  });

  /* ---------- SVG 插圖 ---------- */
  function puller(x, flip, color, delay) {
    return '<g transform="translate(' + x + ',165)' + (flip ? ' scale(-1,1)' : '') + '">' +
      '<g class="lean" style="animation-delay:' + delay + 's">' +
      '<path d="M-4 -38L-20 0M5 -38L12 0" stroke="' + INK + '" stroke-width="8" stroke-linecap="round" fill="none"/>' +
      '<rect x="-15" y="-82" width="30" height="48" rx="13" fill="' + color + '" stroke="' + INK + '" stroke-width="3"/>' +
      '<path d="M6 -70L38 -64" stroke="' + INK + '" stroke-width="10" stroke-linecap="round"/>' +
      '<path d="M6 -70L38 -64" stroke="' + color + '" stroke-width="4" stroke-linecap="round"/>' +
      '<circle cx="41" cy="-63" r="5.500" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="3"/>' +
      '<circle cx="0" cy="-98" r="16" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="3"/>' +
      '<path d="M-16 -100Q-16 -118 0 -116Q16 -118 16 -100Q8 -107 0 -106Q-8 -107 -16 -100Z" fill="' + INK + '"/>' +
      '<path d="M-14 -99h28" stroke="' + color + '" stroke-width="5"/>' +
      '<circle cx="6" cy="-95" r="2.200" fill="' + INK + '"/>' +
      '<circle cx="11" cy="-90" r="3" fill="#F2A497"/>' +
      '<path d="M2 -88Q6 -83 11 -87" stroke="' + INK + '" stroke-width="2" fill="none" stroke-linecap="round"/>' +
      '</g></g>';
  }
  function cloud(x, y, s) {
    return '<g class="cloud"><path transform="translate(' + x + ',' + y + ') scale(' + s + ')" d="M0 24q-2-18 16-18q4-12 20-8q12-6 20 6q16 0 14 20z" fill="#FFFCF6" stroke="' + INK + '" stroke-width="' + (3 / s) + '" stroke-linejoin="round"/></g>';
  }
  function buildStage() {
    var svg = $('#stageSvg');
    var s = '';
    s += '<circle cx="740" cy="44" r="22" fill="#F6D27A" stroke="' + INK + '" stroke-width="3"/>';
    s += cloud(60, 20, 1) + cloud(300, 8, 0.8);
    // 地面
    s += '<rect x="-40" y="165" width="880" height="35" rx="12" fill="#B9DAA5" stroke="' + INK + '" stroke-width="3"/>';
    // 固定中線
    s += '<path d="M400 50V165" stroke="' + INK + '" stroke-width="3" stroke-dasharray="6 7" fill="none"/>';
    s += '<path d="M400 50l-12 8 12 8z" fill="#FFFCF6" stroke="' + INK + '" stroke-width="2.500" stroke-linejoin="round"/>';
    // 會移動的部分
    s += '<g id="ropeGroup">';
    s += '<path d="M20 97H780" stroke="' + INK + '" stroke-width="10" stroke-linecap="round"/>';
    s += '<path d="M20 97H780" stroke="#FFFCF6" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round"/>';
    s += '<path d="M400 97v22" stroke="' + INK + '" stroke-width="3"/>';
    s += '<path d="M400 108l22 8-22 8z" fill="#F2A497" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>';
    s += puller(110, false, TEAMS[0].color, 0) + puller(190, false, TEAMS[0].color, 0.3);
    s += puller(690, true, TEAMS[1].color, 0.15) + puller(610, true, TEAMS[1].color, 0.45);
    s += '</g>';
    svg.innerHTML = s; // 只含程式內建的固定圖形，不含任何使用者輸入
  }
  function cheerFig(color, up) {
    return '<svg viewBox="0 0 100 130" aria-hidden="true">' +
      '<path d="M42 84L36 120M58 84L64 120" stroke="' + INK + '" stroke-width="8" stroke-linecap="round"/>' +
      '<path d="M30 66L' + (up ? '14 34' : '14 80') + 'M70 66L' + (up ? '86 34' : '86 80') + '" stroke="' + INK + '" stroke-width="11" stroke-linecap="round"/>' +
      '<path d="M30 66L' + (up ? '14 34' : '14 80') + 'M70 66L' + (up ? '86 34' : '86 80') + '" stroke="' + color + '" stroke-width="5" stroke-linecap="round"/>' +
      '<circle cx="' + (up ? 14 : 14) + '" cy="' + (up ? 32 : 82) + '" r="6" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="3"/>' +
      '<circle cx="86" cy="' + (up ? 32 : 82) + '" r="6" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="3"/>' +
      '<rect x="28" y="52" width="44" height="42" rx="16" fill="' + color + '" stroke="' + INK + '" stroke-width="3"/>' +
      '<circle cx="50" cy="30" r="20" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="3"/>' +
      '<path d="M30 28Q30 6 50 8Q70 6 70 28Q60 18 50 19Q40 18 30 28Z" fill="' + INK + '"/>' +
      '<circle cx="42" cy="32" r="2.500" fill="' + INK + '"/><circle cx="58" cy="32" r="2.500" fill="' + INK + '"/>' +
      '<circle cx="36" cy="39" r="4" fill="#F2A497"/><circle cx="64" cy="39" r="4" fill="#F2A497"/>' +
      '<path d="M43 40Q50 48 57 40Z" fill="#FFFCF6" stroke="' + INK + '" stroke-width="2.500" stroke-linejoin="round"/>' +
      '</svg>';
  }

  /* ---------- 繩子隨機左右移動 ---------- */
  function setRope(off, dur) {
    var g = $('#ropeGroup');
    g.style.transition = 'transform ' + dur + 's ease-in-out';
    g.style.transform = 'translateX(' + off + 'px)';
  }
  var lastOff = 0;
  function ropeLoop() {
    if (!game || game.over) return;
    var off, tries = 0;
    do { off = Math.round((Math.random() * 2 - 1) * 75); tries++; } while (Math.abs(off - lastOff) < 30 && tries < 8);
    lastOff = off;
    var dur = 0.5 + Math.random() * 0.7;
    setRope(off, dur);
    ropeId = setTimeout(ropeLoop, 700 + Math.random() * 1500);
  }

  /* ---------- 題庫解析（僅當資料） ---------- */
  function parseBank(text) {
    var items = [], errors = [];
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      if (items.length >= 100) { errors.push('題目最多 100 題，其餘已忽略'); break; }
      var cut = /[／\/]\s*(?=[\[［])/.exec(line);
      if (!cut) { errors.push('第 ' + (i + 1) + ' 行：格式需為「題目／[選項1][選項2][[正確選項]]」'); continue; }
      var q = line.slice(0, cut.index).trim();
      var optStr = line.slice(cut.index + cut[0].length)
        .replace(/([\[［])\s+(?=[\[［])/g, '$1')
        .replace(/([\]］])\s+(?=[\]］])/g, '$1');
      if (!q || q.length > 200) { errors.push('第 ' + (i + 1) + ' 行：題目不可空白，且不超過 200 字'); continue; }
      var re = /(?:\[|［){2}([\s\S]*?)(?:\]|］){2}|(?:\[|［)([\s\S]*?)(?:\]|］)/g, m, opts = [], correct = 0, bad = false;
      while ((m = re.exec(optStr))) {
        var isCorrect = m[1] !== undefined;
        var t = (isCorrect ? m[1] : m[2]).trim();
        if (!t || t.length > 100) { bad = true; break; }
        if (isCorrect) correct++;
        opts.push({ text: t, correct: isCorrect });
      }
      if (bad) { errors.push('第 ' + (i + 1) + ' 行：選項內容空白或超過 100 字'); continue; }
      if (opts.length < 2 || opts.length > 6) { errors.push('第 ' + (i + 1) + ' 行：選項需為 2～6 個'); continue; }
      if (correct !== 1) { errors.push('第 ' + (i + 1) + ' 行：需要剛好 1 個正確答案，用 [[ ]] 標示'); continue; }
      items.push({ q: q, opts: opts });
    }
    return { items: items, errors: errors };
  }

  /* ---------- 遊戲流程 ---------- */
  // 每次換題時，隨機決定選項的顯示順序（兩隊各自獨立）
  function prepareQ(T) {
    var o = [], n = bank[T.list[T.pos]].opts.length;
    for (var k = 0; k < n; k++) o.push(k);
    T.curOrder = shuffle(o);
  }
  function newTeamState(n) {
    var idx = []; for (var i = 0; i < n; i++) idx.push(i);
    var T = { state: 'ask', list: shuffle(idx), pos: 0, errors: 0, qStart: Date.now(), lockUntil: 0, results: [], curOrder: [] };
    prepareQ(T);
    return T;
  }
  function startGame(items) {
    clearTimeout(ropeId); clearInterval(tickId);
    document.querySelectorAll('.confetti').forEach(function (c) { c.remove(); });
    resultEl.hidden = true;
    bank = items;
    game = { phase: 'main', over: false, t0: Date.now(), teams: [newTeamState(items.length), newTeamState(items.length)] };
    lastOff = 0; setRope(0, 0.3);
    timerEl.textContent = '00:00';
    ui.forEach(function (u) { u.idle.hidden = true; });
    renderTeam(0); renderTeam(1);
    tickId = setInterval(tick, 200);
    ropeId = setTimeout(ropeLoop, 900);
  }

  function renderTeam(i) {
    var T = game.teams[i], u = ui[i];
    var label = game.phase === 'main' ? '第一輪' : '複習';
    u.ask.hidden = T.state !== 'ask';
    u.wait.hidden = T.state !== 'wait';
    if (T.state === 'ask') {
      var q = bank[T.list[T.pos]];
      u.phase.textContent = label + '　' + (T.pos + 1) + ' / ' + T.list.length;
      u.q.textContent = q.q;
      u.opts.textContent = '';
      T.curOrder.forEach(function (oi, k) {
        var o = q.opts[oi];
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt';
        var l = document.createElement('span'); l.className = 'l'; l.textContent = String.fromCharCode(65 + k);
        var t = document.createElement('span'); t.className = 't'; t.textContent = o.text;
        b.appendChild(l); b.appendChild(t);
        b.addEventListener('click', function () { answer(i, oi); });
        u.opts.appendChild(b);
      });
      u.ask.scrollTop = 0;
      setLockUI(i, Date.now() < T.lockUntil);
    } else if (T.state === 'wait') {
      u.phase.textContent = label + '完成';
      u.qt.textContent = '';
      u.lock.hidden = true;
      u.fig.innerHTML = cheerFig(TEAMS[i].color, true);
      u.waitMsg.textContent = '完成了！等待對手答完…';
    }
  }

  function setLockUI(i, locked) {
    var u = ui[i];
    u.lock.hidden = !locked;
    u.opts.querySelectorAll('.opt').forEach(function (b) { b.disabled = locked; });
  }

  function answer(i, optIdx) {
    if (!game || game.over) return;
    var T = game.teams[i];
    if (T.state !== 'ask' || Date.now() < T.lockUntil) return;
    var q = bank[T.list[T.pos]];
    if (q.opts[optIdx].correct) {
      sfx.ok();
      T.results.push({ qi: T.list[T.pos], errors: T.errors, review: game.phase === 'review' });
      T.pos++; T.errors = 0; T.qStart = Date.now();
      if (T.pos < T.list.length) prepareQ(T);
      flash(i, 'ok');
      if (T.pos >= T.list.length) { T.state = 'wait'; renderTeam(i); sfx.wait(); checkBoth(); }
      else renderTeam(i);
    } else {
      wrong(i, '答錯了！冷靜一下，倒數結束再作答');
    }
  }
  function wrong(i, msg) {
    var T = game.teams[i];
    T.errors++;
    T.lockUntil = Date.now() + LOCK_MS;
    T.qStart = T.lockUntil;
    sfx.bad();
    ui[i].lockMsg.textContent = msg;
    ui[i].lockN.textContent = '3';
    setLockUI(i, true);
    flash(i, 'shake');
  }
  function flash(i, cls) {
    var r = ui[i].root; r.classList.remove('ok', 'shake'); void r.offsetWidth; r.classList.add(cls);
  }

  function tick() {
    if (!game || game.over) return;
    var now = Date.now();
    timerEl.textContent = fmt(Math.floor((now - game.t0) / 1000));
    game.teams.forEach(function (T, i) {
      if (T.state !== 'ask') return;
      var u = ui[i];
      if (now < T.lockUntil) {
        u.lockN.textContent = String(Math.ceil((T.lockUntil - now) / 1000));
        u.qt.textContent = '3:00';
        return;
      }
      if (!u.lock.hidden) setLockUI(i, false);
      var rem = LIMIT_MS - (now - T.qStart);
      if (rem <= 0) { wrong(i, '超過 3 分鐘，視為答錯'); return; }
      var s = Math.ceil(rem / 1000);
      u.qt.textContent = Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
    });
  }

  function checkBoth() {
    if (game.teams[0].state !== 'wait' || game.teams[1].state !== 'wait') return;
    if (game.phase === 'main') startReview(); else endGame();
  }

  function startReview() {
    game.phase = 'review';
    game.teams.forEach(function (T, i) {
      var wrongSet = [];
      T.results.forEach(function (r) { if (r.errors > 0 && wrongSet.indexOf(r.qi) === -1) wrongSet.push(r.qi); });
      var want = Math.min(3, bank.length);
      var pick = shuffle(wrongSet.slice()).slice(0, want);
      if (pick.length < want) {
        var rest = [];
        for (var k = 0; k < bank.length; k++) if (pick.indexOf(k) === -1) rest.push(k);
        shuffle(rest).slice(0, want - pick.length).forEach(function (k) { pick.push(k); });
      }
      var prev = T.results;
      var nt = { state: 'ask', list: shuffle(pick), pos: 0, errors: 0, qStart: Date.now(), lockUntil: 0, results: prev, curOrder: [] };
      prepareQ(nt);
      game.teams[i] = nt;
      renderTeam(i);
    });
    showToast('複習時間！');
    sfx.review();
  }

  function showToast(text) {
    var t = document.createElement('div');
    t.className = 'toast'; t.textContent = text;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 1600);
  }

  // 計分：無失誤 1 分、失誤 1 次後答對 0.5 分、失誤 2 次以上 0 分；
  // 每個回合（第一輪／複習）中「有失誤的題數」達 PENALTY_MISSED_Q 題以上，該回合額外扣 PENALTY_POINTS 分；總分最低為 0。
  function score(T) {
    var pts = 0, penalty = 0;
    [false, true].forEach(function (rv) {
      var rs = T.results.filter(function (r) { return r.review === rv; });
      var sub = rs.reduce(function (a, r) { return a + (r.errors === 0 ? 1 : r.errors === 1 ? 0.5 : 0); }, 0);
      var missed = rs.filter(function (r) { return r.errors > 0; }).length;
      if (missed >= PENALTY_MISSED_Q) { sub -= PENALTY_POINTS; penalty += PENALTY_POINTS; }
      pts += sub;
    });
    return { pts: Math.max(0, pts), penalty: penalty };
  }

  function endGame() {
    game.over = true;
    clearInterval(tickId); clearTimeout(ropeId);
    var secs = Math.floor((Date.now() - game.t0) / 1000);
    timerEl.textContent = fmt(secs);
    var sd = [score(game.teams[0]), score(game.teams[1])];
    var sc = [sd[0].pts, sd[1].pts];
    var winner = sc[0] === sc[1] ? -1 : (sc[0] > sc[1] ? 0 : 1);
    // 繩子被獲勝隊拉過去
    if (winner === 0) setRope(-85, 1.2); else if (winner === 1) setRope(85, 1.2); else setRope(0, 1);
    setTimeout(function () { showResult(sc, winner, secs, sd); }, 1500);
  }

  function showResult(sc, winner, secs, sd) {
    $('#resTitle').textContent = winner === -1 ? '平手！勢均力敵' : TEAMS[winner].name + '獲勝！';
    var box = $('#resScores'); box.textContent = '';
    [0, 1].forEach(function (i) {
      var d = document.createElement('div');
      d.className = 'sc' + (winner === i || winner === -1 ? ' win' : '');
      d.style.setProperty('--tc', TEAMS[i].color);
      var fig = document.createElement('div'); fig.innerHTML = cheerFig(TEAMS[i].color, winner === i || winner === -1);
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = TEAMS[i].name;
      var pt = document.createElement('div'); pt.className = 'pt'; pt.textContent = numText(sc[i]) + ' 分';
      d.appendChild(fig); d.appendChild(nm); d.appendChild(pt);
      if (sd[i].penalty > 0) {
        var nt = document.createElement('div'); nt.className = 'note';
        nt.textContent = '失誤達 ' + PENALTY_MISSED_Q + ' 題以上，已扣 ' + numText(sd[i].penalty) + ' 分';
        d.appendChild(nt);
      }
      box.appendChild(d);
    });
    $('#resMeta').textContent = '總用時 ' + fmt(secs) + '（含複習題）';
    resultEl.hidden = false;
    sfx.win();
    var colors = [TEAMS[0].color, TEAMS[1].color, '#F2A497', '#B9DAA5'];
    for (var n = 0; n < 40; n++) {
      var c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = winner === -1 ? colors[n % 4] : (n % 3 === 0 ? colors[2 + (n % 2)] : TEAMS[winner].color);
      c.style.animationDuration = (2.5 + Math.random() * 3) + 's';
      c.style.animationDelay = (-Math.random() * 5) + 's';
      document.body.appendChild(c);
    }
  }

  /* ---------- 題庫視窗 ---------- */
  function openBank() {
    bankErr.textContent = '';
    $('#bankCancel').hidden = !game;
    if (!dlg.open) dlg.showModal();
  }
  var presetSel = $('#presetSel');
  (function fillPresets() {
    var o0 = document.createElement('option'); o0.value = ''; o0.textContent = '自訂輸入'; presetSel.appendChild(o0);
    PRESET_BANKS.forEach(function (p) {
      var o = document.createElement('option'); o.value = p.id; o.textContent = p.name; presetSel.appendChild(o);
    });
  })();
  function loadPreset(id) {
    var p = PRESET_BANKS.filter(function (x) { return x.id === id; })[0];
    if (p) { bankInput.value = p.text.trim(); presetSel.value = id; }
    bankErr.textContent = '';
  }
  presetSel.addEventListener('change', function () { loadPreset(presetSel.value); });
  bankInput.addEventListener('input', function () { presetSel.value = ''; });
  $('#bankBtn').addEventListener('click', openBank);
  $('#bankCancel').addEventListener('click', function () { dlg.close(); });
  $('#bankStart').addEventListener('click', function () {
    var r = parseBank(bankInput.value);
    var fatal = r.errors.filter(function (e) { return e.indexOf('最多') === -1; });
    if (fatal.length) { bankErr.textContent = fatal.slice(0, 5).join('\n'); return; }
    if (!r.items.length) { bankErr.textContent = '請至少輸入一題。'; return; }
    ensureAudio();
    dlg.close();
    startGame(r.items);
  });
  $('#againBtn').addEventListener('click', function () { ensureAudio(); startGame(bank); });
  $('#newBankBtn').addEventListener('click', function () { resultEl.hidden = true; openBank(); });

  /* ---------- 加粗、全螢幕 ---------- */
  var boldBtn = $('#boldBtn');
  boldBtn.addEventListener('click', function () {
    var on = document.body.classList.toggle('bold');
    boldBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  var fsBtn = $('#fsBtn'), root = document.documentElement;
  var canFs = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!canFs) fsBtn.hidden = true;
  fsBtn.addEventListener('click', function () {
    var inFs = document.fullscreenElement || document.webkitFullscreenElement;
    try {
      if (inFs) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
      else { (root.requestFullscreen || root.webkitRequestFullscreen).call(root); }
    } catch (e) {}
  });
  function fsLabel() { fsBtn.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? '退出全螢幕' : '全螢幕'; }
  document.addEventListener('fullscreenchange', fsLabel);
  document.addEventListener('webkitfullscreenchange', fsLabel);

  /* ---------- 初始化 ---------- */
  buildStage();
  if (PRESET_BANKS.length) loadPreset(PRESET_BANKS[0].id);
  openBank();
})();
</script>
