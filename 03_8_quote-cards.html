            "#f3f4f6", // 云霧灰 (gray-100)
            "#f4f4f5", // 沉穩淺灰 (zinc-100)
            "#f5f5f4", // 暖暖石灰 (stone-100)
            "#e2e8f0", // 亞麻灰 (slate-200)
            "#e5e7eb", // 燕麥灰 (gray-200)
            "#e4e4e7"  // 青石灰 (zinc-200)
        ];

        // Web Audio 翻牌輕快音效
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playFlipSound() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        let currentIdx = -1;

        function drawCard() {
            const card = document.getElementById('quoteCard');
            card.classList.add('card-hidden');

            playFlipSound();

            setTimeout(() => {
                // 1. 隨機選一句話 (避免跟上一句重複)
                let randomIdx;
                do {
                    randomIdx = Math.floor(Math.random() * quotesPool.length);
                } while (randomIdx === currentIdx && quotesPool.length > 1);
                currentIdx = randomIdx;

                const fullQuote = quotesPool[randomIdx];
                let text = fullQuote;
                let author = "── 每日智慧指引";

                // 解析內容與作者 (若有 " ── ")
                if (fullQuote.includes(" ── ")) {
                    const parts = fullQuote.split(" ── ");
                    text = parts[0];
                    author = "── " + parts[1];
                }

                document.getElementById('quoteText').textContent = text;
                document.getElementById('quoteAuthor').textContent = author;

                // 2. 隨機變換淺灰色系背景
                const randomBg = grayThemeBg[Math.floor(Math.random() * grayThemeBg.length)];
                document.getElementById('bgContainer').style.backgroundColor = randomBg;

                // 3. 卡片翻回呈現
                card.classList.remove('card-hidden');
            }, 300);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // 頁面載入時自動抽一張卡片
        window.onload = function() {
            drawCard();
        };
    </script>
</body>
</html>
