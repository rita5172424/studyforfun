<title>康軒七年級｜音樂家與職籃巨星</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
<style>

body{background:var(--bg);color:var(--jade);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7;min-height:100vh}
.wrap{max-width:1320px;margin:0 auto;padding:8px 14px 16px}
a,button{font:inherit;color:inherit}
button{cursor:pointer;border:0}

.back{color:var(--tt);text-decoration:none;font-size:.85rem}
.layout{display:grid;grid-template-columns:128px minmax(0,1fr) 128px;gap:12px;align-items:start;margin-top:4px}

.tm.end{color:var(--red);animation:bl .6s infinite}

.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:12px 0}

.slip.sm>div{font-size:1.6rem;min-height:200px;padding:22px 14px}
.slip.drop{animation:drop .35s cubic-bezier(.2,.8,.2,1)}

.md.wide{width:min(1120px,100%)}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;margin-bottom:20px}

.mt button:nth-child(odd){font-size:1.5rem;font-family:"Noto Serif TC",serif;letter-spacing:.1em;font-weight:500}
.card b.idw{font-size:1.6rem;font-family:"Noto Serif TC",serif;letter-spacing:.1em}

.vduo{display:flex;flex-direction:row-reverse;gap:14px;align-items:flex-start;margin-top:8px}

.vq .mq{margin:0 0 0 1.6em;display:block}
.vq .qt{font-weight:500;max-height:calc(var(--sh) - 40px);margin-left:.5em}
.vq .mq .opt{writing-mode:vertical-rl;display:block;width:auto;height:fit-content;max-height:calc(var(--sh) - 40px);margin:0 0 0 .4em;padding:8px 4px;font-size:1.15rem;line-height:1.9;text-align:start;background:var(--jade);border:1px solid #DDD8C9}
.vq .mq .opt.ok{background:#DCEBDD;border-color:var(--ok)}.vq .mq .opt.no{background:#EBD6D6;border-color:var(--red)}
.vq .sum{margin:0 0 0 .4em;max-height:calc(var(--sh) - 40px);padding:6px 8px;font-size:1.05rem}
.vq .ex{max-height:calc(var(--sh) - 40px);font-size:1.05rem}
.vq .hb{writing-mode:vertical-rl;display:block;height:fit-content;margin:0 0 0 .4em;padding:8px 4px;font-size:1rem;letter-spacing:.08em}
.vq .sum .hb{display:inline-block;margin:.4em 0 0 0;padding:6px 3px;font-size:.95rem}
.row2{display:flex;align-items:center;gap:18px;margin:8px 0 10px}
.pick{font-family:"Noto Serif TC",serif;font-size:2.4rem;letter-spacing:.1em;color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pane{background:var(--jade);border:1px solid var(--gl);padding:10px 16px}

.vr{margin-bottom:6px}.vr b{display:block}
.fr{margin:8px 0;line-height:2.2}.fr small{color:var(--soft);font-size:.9rem}
.bl{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 4px}
@media (max-width:900px){.vduo{flex-direction:column}.vsup{max-width:100%}.two{grid-template-columns:1fr}.rg{grid-template-columns:1fr}.rg .psg{position:static;max-height:none}.layout{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap}.grp{flex-direction:row;flex-wrap:wrap;align-items:center}.scroller{padding:20px}.vt{font-size:1.45rem}}

</style>

const chip = $("#chip");
let tmTotal = 300, tmLeft = 300, tmEnd = 0, tmRun = null, tmDone = false;
const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
function beep() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)();
    [0, .4, .8].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(.25, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .3); o.start(a.currentTime + t); o.stop(a.currentTime + t + .35); });
  } catch (e) {}
}
function upd() {
  const d = document.getElementById("tmd");
  const txt = tmDone ? "時間到" : fmt(tmLeft);
  if (d) { d.textContent = txt; d.classList.toggle("end", tmDone); }
  chip.style.display = (tmRun || tmDone) ? "block" : "none"; chip.textContent = "⏱ " + txt; chip.classList.toggle("end", tmDone);
}
function tmSet(m) { clearInterval(tmRun); tmRun = null; tmDone = false; tmTotal = tmLeft = Math.max(1, Math.round(m * 60)); upd(); }
function tmStart() {
  if (tmRun) return; if (tmDone || tmLeft <= 0) { tmDone = false; tmLeft = tmTotal; }
  tmEnd = Date.now() + tmLeft * 1000;
  tmRun = setInterval(() => { tmLeft = Math.max(0, Math.round((tmEnd - Date.now()) / 1000)); if (tmLeft <= 0) { clearInterval(tmRun); tmRun = null; tmDone = true; beep(); } upd(); }, 250); upd();
}
function tmPause() { clearInterval(tmRun); tmRun = null; upd(); }

const WS_POOL = [["詮釋", 3], ["崇拜", 3], ["絢麗", 3], ["熱衷", 3], ["心無旁騖", 3], ["脫穎而出", 3], ["彌補", 3], ["拚命", 3], ["精湛", 3], ["氣餒", 3], ["出神入化", 3], ["嘆為觀止", 2], ["臨渴掘井", 2], ["如虎添翼", 2], ["出人意表", 2], ["開花結果", 1], ["勤能補拙", 2], ["璞玉", 2], ["琢磨", 2], ["助勢", 1], ["網羅", 2], ["鋪路", 1], ["暴漲", 2], ["二軍", 1], ["飲泣", 1], ["衡量", 2], ["資賦", 1], ["神童", 1], ["白費心血", 1], ["磨練", 1], ["苦練", 2], ["好手", 1], ["致命", 1], ["物換星移", 1]];
function wsMake() {
  const N = 7, D = [[1, 0], [0, 1], [1, 1], [1, -1], [0, -1]], R = n => Math.floor(Math.random() * n);
  for (let t = 0; t < 300; t++) {
    const D2 = D.filter(d => !(d[0] === 1 && d[1] === 0)), pick = () => Math.random() < .65 ? [1, 0] : D2[R(D2.length)];
    const n = 7 + R(4), pool = WS_POOL.flatMap(([w, k]) => Array(k).fill(w)), ws = [];
    while (ws.length < n) { const w = pool[R(pool.length)]; if (!ws.includes(w)) ws.push(w); }
    ws.sort((a, b) => b.length - a.length);
    const g = Array.from({ length: N }, () => Array(N).fill("")), pos = []; let ok = true;
    for (const w of ws) { let done = false;
      for (let k = 0; k < 120 && !done; k++) { const [dr, dc] = pick(), r = R(N), c = R(N), cells = [];
        let good = true; for (let i = 0; i < w.length; i++) { const rr = r + dr * i, cc = c + dc * i;
          if (rr < 0 || cc < 0 || rr >= N || cc >= N || (g[rr][cc] && g[rr][cc] !== w[i])) { good = false; break; } cells.push([rr, cc]); }

      if (!done) { ok = false; break; } }
    if (!ok) continue;
    const chars = [...new Set(WS_POOL.map(p => p[0]).join("").split(""))];
    g.forEach(row => row.forEach((v, i) => { if (!v) row[i] = chars[R(chars.length)]; }));
    return { g, pos };
  }
}

  "相關閱讀": () => { const w = el("div"); READ.forEach((s, i) => { const box = el("div", "psg", s.psg), g = el("div", "rg");
    g.append(box, mcq(s.qs, h => { box.innerHTML = h ? s.psg.replace(h, `<mark>${h}</mark>`) : s.psg; }, true)); w.append(el("h3", "", `題組 ${i + 1}`), g); });
    modal("相關閱讀理解", w, true); }
};
const GROUPS = [["L", "閱讀輔助", "g1", ["圈詞", "閱讀尺", "全文朗讀", "停止朗讀"]], ["R", "學習活動", "g2", ["核心問題", "趣味常識", "課文補給站", "注釋", "試題練習", "成語配對", "相關閱讀", "應用小挑戰", "字謎"]], ["L", "班級經營", "g3", ["計時器", "座位抽籤", "朗讀方式抽籤"]], ["L", "講義", "g4", ["下載講義", "前往測驗頁"]]];
GROUPS.forEach(([side, name, cls, items]) => { const g = el("div", "grp " + cls); g.append(el("h3", "", name));
  items.forEach(k => { const b = el("button", "b", k); b.onclick = () => act[k](b); g.append(b); }); $(side === "L" ? "#sl" : "#sr").append(g); });

/* ========= 閱讀尺：跟隨滑鼠／手指 ========= */
const stage = $("#stage"), ruler = $("#ruler");
const mv = e => { const r = stage.getBoundingClientRect(); ruler.style.left = Math.max(0, Math.min(e.clientX - r.left - ruler.offsetWidth / 2, r.width - ruler.offsetWidth)) + "px"; };
stage.addEventListener("pointermove", mv); stage.addEventListener("pointerdown", mv);
</script>
