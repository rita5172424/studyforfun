<style>

button{cursor:pointer;border:0}

.back{color:var(--tt);text-decoration:none;font-size:.85rem}

.slip.sm>div{font-size:1.6rem;min-height:200px;padding:22px 14px}
.slip.drop{animation:drop .35s cubic-bezier(.2,.8,.2,1)}

.md.wide{width:min(1120px,100%)}

.card b.idw{font-size:1.6rem;font-family:"Noto Serif TC",serif;letter-spacing:.1em}
.nb{position:absolute;top:8px;left:8px;min-width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--gl);font-size:.8rem;font-family:"Noto Serif TC",serif}
.ff .nb{color:var(--gold)}.fb .nb{color:var(--ink)}

.big{font-size:1.3rem}

.vduo{display:flex;flex-direction:row-reverse;gap:14px;align-items:flex-start;margin-top:8px}

.vq .sum .hb{display:inline-block;margin:.4em 0 0 0;padding:6px 3px;font-size:.95rem}
.row2{display:flex;align-items:center;gap:18px;margin:8px 0 10px}
.pick{font-family:"Noto Serif TC",serif;font-size:2.4rem;letter-spacing:.1em;color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pane{background:var(--jade);border:1px solid var(--gl);padding:10px 16px}

.vr{margin-bottom:6px}.vr b{display:block}
.fr{margin:8px 0;line-height:2.2}.fr small{color:var(--soft);font-size:.9rem}
.bl{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 4px}
.idg{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start;margin-bottom:12px}
.idl button{display:block;width:100%;text-align:left;font-family:"Noto Serif TC",serif;font-size:1.45rem;letter-spacing:.1em;padding:10px 14px;margin-bottom:8px;background:var(--jade);border:1px solid #DDD8C9;color:var(--ink)}
.idl button.on{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.idc{background:var(--jade);border:1px solid var(--gl);padding:12px;cursor:pointer;text-align:center;color:var(--ink)}

.idn{display:flex;gap:10px;justify-content:center;margin-top:8px}
@media (max-width:900px){.idg{grid-template-columns:1fr}.idl{display:flex;flex-wrap:wrap;gap:6px}.idl button{width:auto}}
@media (max-width:900px){.vduo{flex-direction:column}.vsup{max-width:100%}.two{grid-template-columns:1fr}.rg{grid-template-columns:1fr}.rg .psg{position:static;max-height:none}.layout{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap}.grp{flex-direction:row;flex-wrap:wrap;align-items:center}.scroller{padding:20px}.vt{font-size:1.45rem}}
@media (prefers-reduced-motion:reduce){.fi,.pq.open,.md{animation:none;transition:none}}
</style>

vt.append(el("h1", "vtitle", "今夜看螢去<small>南方朔</small>"));
function stop() { synth && synth.cancel(); document.querySelectorAll(".say").forEach(p => p.classList.remove("say")); cur = null; }
function speak(i) {
  if (!synth) return alert("此瀏覽器不支援朗讀");
  const same = cur === i; stop(); if (same) return;
  cur = i; const p = document.getElementById("p" + i); p.classList.add("say");
  const u = new SpeechSynthesisUtterance(PARAS[i].t.replace(/\n/g, "，")); u.lang = "zh-TW"; u.rate = .85;
  u.onend = () => { if (cur === i) stop(); }; synth.speak(u);
}
function alignRight(e) { const a = sc.getBoundingClientRect(), r = e.getBoundingClientRect(); sc.scrollBy({ left: r.right - (a.right - 28), behavior: "smooth" }); }
function jump(i) { document.querySelectorAll(".jb").forEach((b, k) => b.classList.toggle("on", k === i)); alignRight(i === 0 ? vt.querySelector(".vtitle") : document.getElementById("p" + i)); }
PARAS.forEach((p, i) => {
  let h = nl(p.t); (p.kw || []).forEach(k => h = h.split(k).join(`<span class="kw">${k}</span>`));
  const d = el("div", "para"); d.id = "p" + i;
  const pl = el("button", "", "▶ 朗讀"); pl.onclick = () => speak(i);
  const t = el("span", "", h);
  const qm = el("button", "", "？"); qm.setAttribute("aria-label", "段落理解題");
  const q = el("div", "pq"); q.append(mcq(p.q || []));
  qm.onclick = () => { q.classList.toggle("open"); if (q.classList.contains("open")) setTimeout(() => alignRight(q), 220); };
  d.append(pl, t, qm, q); vt.append(d);
});

function idiomCards(title, pairs) {
  let cur = 0;
  const w = el("div"), g = el("div", "idg"), L = el("div", "idl"), R = el("div", "idr"), card = el("div", "idc"), nav = el("div", "idn");
  const btns = pairs.map((p, i) => { const b = el("button", i ? "" : "on", p[0]); b.onclick = () => show(i); L.append(b); return b; });
  const pv = el("button", "chk", "◀ 上一張"), nx = el("button", "chk", "下一張 ▶");
  function show(i) { cur = (i + pairs.length) % pairs.length; const p = pairs[cur], a = IART[p[0]] || {};
    btns.forEach((b, k) => b.classList.toggle("on", k === cur));
    card.innerHTML = `${a.svg || ""}<div class="nm">${p[0]}</div><div class="mn">${p[1]}</div><div class="tp2" hidden>💡 ${a.tip || "想一想：這個成語的字面意思是什麼？"}</div><div class="ex">👆 點一下圖卡，看記憶小提示（第 ${cur + 1} ／ ${pairs.length} 張）</div>`; }
  card.onclick = () => { const t = card.querySelector(".tp2"); t.hidden = !t.hidden; };
  pv.onclick = () => show(cur - 1); nx.onclick = () => show(cur + 1); nav.append(pv, nx);
  R.append(card, nav); g.append(L, R); show(0);
  const go = el("button", "chk", "我記好了，開始配對測驗"); go.onclick = () => match(title, pairs, false);
  w.append(el("p", "ex", "點左邊的成語，右邊會出現圖卡；點一下圖卡，看記憶小提示。看完再按下面的按鈕開始測驗。"), g, go);
  modal(title + "・成語圖卡", w, true);
}

/* ========= 連連看（idioms 先看正確版本，再測驗；可重新連線）========= */
function match(title, pairs, study) {
  if (study) return idiomCards(title, pairs);
  const wrap = el("div"), g = el("div", "mt"), svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const order = pairs.map((_, i) => i).sort(() => Math.random() - .5);
  const L = pairs.map(p => el("button", "", p[0])), R = order.map(i => { const b = el("button", "", pairs[i][1]); b.dataset.id = i; return b; });
  const link = {}; let sel = null, res = {};
  const draw = () => {
    svg.innerHTML = ""; const gb = g.getBoundingClientRect();
    Object.entries(link).forEach(([l, r]) => {
      const a = L[l].getBoundingClientRect(), b = R[r].getBoundingClientRect(), n = document.createElementNS(svg.namespaceURI, "line");
      n.setAttribute("x1", a.right - gb.left); n.setAttribute("y1", a.top + a.height / 2 - gb.top);
      n.setAttribute("x2", b.left - gb.left); n.setAttribute("y2", b.top + b.height / 2 - gb.top);
      n.setAttribute("stroke", res[l] === true ? "#3F7D4E" : res[l] === false ? "#8B1E1E" : "#D9AE4E"); n.setAttribute("stroke-width", 2.5); svg.append(n);
    });
  };
  L.forEach((b, i) => b.onclick = () => { delete link[i]; res = {}; sel = sel === i ? null : i; L.forEach((x, k) => x.className = k === sel ? "sel" : ""); R.forEach(x => x.className = ""); draw(); });
  R.forEach((b, r) => b.onclick = () => {
    if (sel == null) return; for (const k in link) if (link[k] === r) delete link[k];
    link[sel] = r; sel = null; res = {}; L.forEach(x => x.className = ""); R.forEach(x => x.className = ""); draw();
  });
  const msg = el("p", "", ""), ck = el("button", "chk", "檢查答案"), rt = el("button", "chk", "↺ 重新連線");
  ck.onclick = () => {
    let ok = 0; L.forEach((b, i) => { const r = link[i]; res[i] = r != null && +R[r].dataset.id === i; if (res[i]) ok++; b.className = r == null ? "" : res[i] ? "ok" : "bad"; });
    draw(); msg.textContent = ok === pairs.length ? "🎉 全部連對了！" : `連對 ${ok} / ${pairs.length}，按「重新連線」再試一次。`;
  };
  rt.onclick = () => match(title, pairs, false);
  g.append(...L.flatMap((b, i) => [b, R[i]]), svg);
  wrap.append(el("p", "ex", "先點左邊詞語，再點右邊對應的解釋，即可連線。"), g, ck, rt, msg);
  modal(title, wrap); requestAnimationFrame(draw);
}

PARAS.forEach((_, i) => { const b = el("button", "jb", String(i + 1)); b.onclick = () => jump(i); b.setAttribute("aria-label", "跳到第 " + (i + 1) + " 段"); $("#jump").append(b); });

/* ========= 班級經營：計時器／座位抽籤／朗讀方式抽籤 ========= */
const chip = $("#chip");
let tmTotal = 300, tmLeft = 300, tmEnd = 0, tmRun = null, tmDone = false;
const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
function beep() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)();
    [0, .4, .8].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(.25, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .3); o.start(a.currentTime + t); o.stop(a.currentTime + t + .35); });
  } catch (e) {}
}
function upd() {
  const d = document.getElementById("tmd");
  const txt = tmDone ? "時間到" : fmt(tmLeft);
  if (d) { d.textContent = txt; d.classList.toggle("end", tmDone); }
  chip.style.display = (tmRun || tmDone) ? "block" : "none"; chip.textContent = "⏱ " + txt; chip.classList.toggle("end", tmDone);
}
function tmSet(m) { clearInterval(tmRun); tmRun = null; tmDone = false; tmTotal = tmLeft = Math.max(1, Math.round(m * 60)); upd(); }
function tmStart() {
  if (tmRun) return; if (tmDone || tmLeft <= 0) { tmDone = false; tmLeft = tmTotal; }
  tmEnd = Date.now() + tmLeft * 1000;
  tmRun = setInterval(() => { tmLeft = Math.max(0, Math.round((tmEnd - Date.now()) / 1000)); if (tmLeft <= 0) { clearInterval(tmRun); tmRun = null; tmDone = true; beep(); } upd(); }, 250); upd();

function buildHandout() {

  const vq = (x, i) => `<div class="vqi"><div class="vqt">（　）${FW(i)}．${x.q}</div><div>${x.o.map((t, j) => `（${OL[j]}）${t}`).join("　")}</div></div>`;
  const rot = (a, k) => a.map((_, i) => a[(i + k) % a.length]);
  const pg = (n, b, head, cls) => `<div class="pgw${cls ? " pl" : ""}"><div class="hp${cls ? " " + cls : ""}">${head || ""}<div class="hbd${cls ? " vt" : ""}">${b}</div><div class="hf">第 ${n} 頁　／　共 4 頁</div></div></div>`;
  const head = `<div class="hd"><h1>${LESSON.name}　學習講義<small>${LESSON.ver}　${LESSON.author}</small></h1><div class="nm">班級<span></span>姓名<span></span></div></div>`;
  const s1 = sec(0, "核心問題", "", CORE.map((c, i) => `<div class="hq"><div class="hqt cq">${i + 1}. ${c}</div><div class="ln22"></div></div>`).join(""));
  const rights = rot(NOTES.map(n => n[1]), 3);
  const s2 = sec(1, "注釋連連看", "用線把左邊的詞語和右邊正確的解釋連起來。", NOTES.map((n, i) => `<div class="mrow"><div class="ml">${n[0]}<i class="dot"></i></div><div class="mr"><i class="dot"></i>${rights[i]}</div></div>`).join(""));
  const words = IDIOMS.map(x => x[0]);
  const s3 = sec(2, "成語填空", "看解釋，從成語選項選一個，抄寫在底線上。", `<div class="bank"><b>成語選項：</b>${rot(words, 2).map(w => `<span>${w}</span>`).join("")}</div>` + IDIOMS.map((x, i) => `<div class="fill">${i + 1}. ${x[1]}<span class="bl" style="min-width:58mm"></span></div>`).join(""));
  const art = `<div class="art">${SUP.map(([t, x]) => `<div class="vb">${t ? `<b>${t}</b>` : ""}<p>${x}</p></div>`).join("")}</div>`;
  const s4 = vsec(3, "課文補給站", "先讀短文，再回答題目，把答案代號填進（　）。", art + `<div class="qz">${SUPQ.map((x, i) => vq(x, i + 1)).join("")}</div>`);
  const per = Math.ceil(6 / PARAS.length); let c = 0; const allq = PARAS.flatMap(p => p.q.slice(0, per)), pick6 = allq.length <= 6 ? allq : [0, 1, 2, 3, 4, 5].map(k => allq[Math.round(k * (allq.length - 1) / 5)]);
  const s5 = vsec(4, "課文理解問答題", "把答案代號填進（　）。", `<div class="qz">${pick6.map(x => vq(x, ++c)).join("")}</div>`);

  const s7 = sec(6, "應用小挑戰", "", `<div class="sub">任務一：自然小日記　<span class="ex" style="display:inline">① 圈一個情境　② 看提示詞　③ 補完 3 行（用說的也可以，3 行完成就很棒）</span></div>
    <table><tr><th>情境</th><th>我看到</th><th>我聽到</th><th>我覺得</th></tr>${OBJS.map(o => `<tr><td>○ ${o.n}</td><td>${o.look.join("、")}</td><td>${o.sound.join("、")}</td><td>${o.like.join("、")}</td></tr>`).join("")}</table>
    <div class="fill">1. 我在 <span class="bl" style="min-width:45mm"></span>，看到 <span class="bl"></span>。</div><div class="fill">2. 我聽到 <span class="bl"></span>。</div><div class="fill">3. 我覺得 <span class="bl"></span>，因為 <span class="bl" style="min-width:45mm"></span>。</div>

/* ========= 字謎（7×7，可下載單頁）=========
   詞庫＝課文圈詞＋預習單字形字音＋習作靜心戀字＋in講義國字注音；數字＝出處數量（越多越容易被抽到）。 */
const WS_POOL = [["潺潺", 3], ["翩翩", 3], ["寂寥", 3], ["迎迓", 3], ["剎那", 3], ["邂逅", 3], ["閨秀", 3], ["紈扇", 3], ["嫻靜", 3], ["會晤", 3], ["田疇", 3], ["風懷", 2], ["弱質蕙心", 2], ["曼妙", 2], ["閃爍", 2], ["玩耍", 2], ["點綴", 2], ["羊腸小徑", 2], ["子夜", 2], ["盛況", 2], ["流連", 2], ["舒緩", 1], ["寬慰", 1], ["感慨", 2], ["遺憾", 2], ["叢生", 1], ["流螢", 2], ["螢火", 1], ["一燈相照", 1], ["蠅頭小利", 1], ["蜻蜓點水", 1], ["噤若寒蟬", 1], ["蚍蜉撼樹", 1], ["蜂擁而至", 1]];
function wsMake() {
  const N = 7, D = [[1, 0], [0, 1], [1, 1], [1, -1], [0, -1]], R = n => Math.floor(Math.random() * n);
  for (let t = 0; t < 300; t++) {
    const D2 = D.filter(d => !(d[0] === 1 && d[1] === 0)), pick = () => Math.random() < .65 ? [1, 0] : D2[R(D2.length)];
    const n = 7 + R(4), pool = WS_POOL.flatMap(([w, k]) => Array(k).fill(w)), ws = [];
    while (ws.length < n) { const w = pool[R(pool.length)]; if (!ws.includes(w)) ws.push(w); }
    ws.sort((a, b) => b.length - a.length);
    const g = Array.from({ length: N }, () => Array(N).fill("")), pos = []; let ok = true;
    for (const w of ws) { let done = false;
      for (let k = 0; k < 120 && !done; k++) { const [dr, dc] = pick(), r = R(N), c = R(N), cells = [];
        let good = true; for (let i = 0; i < w.length; i++) { const rr = r + dr * i, cc = c + dc * i;
          if (rr < 0 || cc < 0 || rr >= N || cc >= N || (g[rr][cc] && g[rr][cc] !== w[i])) { good = false; break; } cells.push([rr, cc]); }
        if (good) { cells.forEach(([rr, cc], i) => g[rr][cc] = w[i]); pos.push({ w, cells }); done = true; } }
      if (!done) { ok = false; break; } }
    if (!ok) continue;
    const chars = [...new Set(WS_POOL.map(p => p[0]).join("").split(""))];
    g.forEach(row => row.forEach((v, i) => { if (!v) row[i] = chars[R(chars.length)]; }));
    return { g, pos };
  }
}

function pick(r,c){
  if(!st){st=[r,c];cell(r,c).classList.add("s");return}
  const [r0,c0]=st,dr=r-r0,dc=c-c0;B.forEach(b=>b.classList.remove("s"));

  if(dr&&dc&&Math.abs(dr)!==Math.abs(dc)){st=[r,c];cell(r,c).classList.add("s");return}
  const n=Math.max(Math.abs(dr),Math.abs(dc))+1,sr=Math.sign(dr),sc=Math.sign(dc),cs=[];let s="";
  for(let i=0;i<n;i++){cs.push([r0+sr*i,c0+sc*i]);s+=G[r0+sr*i][c0+sc*i]}
  const rv=[...s].reverse().join(""),p=POS.find(q=>!found.includes(q.w)&&(q.w===s||q.w===rv));

<\/script></body></html>`;
