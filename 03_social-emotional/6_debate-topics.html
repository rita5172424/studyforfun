            { category: "🔍 拆解「概念與字詞」", text: "「我們一直掛在嘴邊的『好/幸福/公平/安全』，在這裡究竟指的是什麼？有沒有人定義不同？」（思考：語意澄清）" },
            { category: "🔍 拆解「概念與字詞」", text: "「這項爭議的本質，究竟是【安全與自由】的拉扯，還是【利益與道德】的對決？」（思考：哲學對立）" },
            { category: "🔍 拆解「概念與字詞」", text: "「我們真的能明確區分出『真的』和『假的』、『對的』和『錯的』那條界線在哪裡嗎？」（思考：評判標準）" }
        ];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playPopSound() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(480, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(960, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        let lastTopicTitle = "";

        function drawTopic(categoryKey) {
            const card = document.getElementById('topicCard');
            card.classList.add('pop-hidden');

            playPopSound();

            setTimeout(() => {
                let chosenCategory = categoryKey;
                
                if (categoryKey === 'all') {
                    const keys = Object.keys(debatePool);
                    chosenCategory = keys[Math.floor(Math.random() * keys.length)];
                }

                const list = debatePool[chosenCategory];
                let item;

                do {
                    item = list[Math.floor(Math.random() * list.length)];
                } while (item.title === lastTopicTitle && list.length > 1);

                lastTopicTitle = item.title;

                document.getElementById('topicTitle').textContent = `📌 ${item.title}`;
                document.getElementById('proText').textContent = item.pro;
                document.getElementById('conText').textContent = item.con;

                card.classList.remove('pop-hidden');
            }, 200);

            loadRandomHints();
        }

        function loadRandomHints() {
            let shuffled = [...hintsPool].sort(() => 0.5 - Math.random());
            let selected = shuffled.slice(0, 2);

            let html = selected.map(h => `
                <div class="bg-white p-2.5 sm:p-3 rounded-xl border border-amber-200/80 flex items-center gap-3">
                    <span class="text-amber-900 font-black text-xs shrink-0 bg-amber-100 px-2 py-1 rounded-md">${h.category}</span>
                    <p class="leading-relaxed text-slate-800 text-xs sm:text-sm font-bold flex-1">${h.text}</p>
                </div>
            `).join('');

            document.getElementById('hintsContainer').innerHTML = html;
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("全螢幕失敗:", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            drawTopic('school');
        });
    </script>
</body>
</html>
