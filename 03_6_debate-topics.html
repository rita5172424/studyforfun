<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辯論題目百寶箱 | 老師的教學百寶箱</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pop-card {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
        }
        .pop-hidden {
            transform: scale(0.95) translateY(6px);
            opacity: 0;
        }
    </style>
</head>
<body class="bg-slate-50 h-screen overflow-hidden flex flex-col justify-between text-slate-800 select-none">

    <!-- 頂部快速工具列 -->
    <header class="bg-white border-b border-slate-200 px-6 py-2.5 flex justify-between items-center shadow-xs shrink-0 relative z-20">
        <a href="./index.html" class="inline-flex items-center gap-2 text-rose-600 font-extrabold hover:text-rose-800 transition text-base">
            <span>🏠 返回百寶箱首頁</span>
        </a>
        <h1 class="text-lg font-black text-slate-700 hidden sm:block">⚔️ 辯論題目百寶箱</h1>
        <button type="button" onclick="toggleFullScreen()" class="bg-rose-50 hover:bg-rose-100 active:bg-rose-200 text-rose-700 font-bold px-3 py-1.5 rounded-lg text-xs transition cursor-pointer border border-rose-200">
            🖥️ 全螢幕
        </button>
    </header>

    <!-- 主要內容區 (一頁式視圖) -->
    <main class="max-w-6xl mx-auto w-full px-4 py-3 flex-grow flex flex-col justify-between gap-3 relative z-10 overflow-hidden">

        <!-- 頁面標題與控制按鈕區 -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-2 shrink-0">
            <div>
                <h2 class="text-2xl sm:text-3xl font-black text-slate-800 tracking-tight">⚔️ 課堂思辨與辯論題目</h2>
                <p class="text-slate-500 text-xs sm:text-sm font-bold mt-0.5">正反立場解析，打破既定思維限制。</p>
            </div>
            
            <!-- 分類選單與抽題按鈕 -->
            <div class="flex flex-wrap gap-1.5 relative z-20">
                <button type="button" onclick="drawTopic('all')" class="bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white font-extrabold px-3.5 py-1.5 rounded-xl text-xs sm:text-sm transition shadow-xs active:scale-95 cursor-pointer">
                    🎲 隨機抽題
                </button>
                <button type="button" onclick="drawTopic('school')" class="bg-slate-100 hover:bg-rose-100 text-slate-700 hover:text-rose-800 font-bold px-3 py-1.5 rounded-xl text-xs sm:text-sm transition active:scale-95 cursor-pointer">
                    🏫 校園與成長
                </button>
                <button type="button" onclick="drawTopic('tech')" class="bg-slate-100 hover:bg-rose-100 text-slate-700 hover:text-rose-800 font-bold px-3 py-1.5 rounded-xl text-xs sm:text-sm transition active:scale-95 cursor-pointer">
                    🌐 科技與未來
                </button>
                <button type="button" onclick="drawTopic('society')" class="bg-slate-100 hover:bg-rose-100 text-slate-700 hover:text-rose-800 font-bold px-3 py-1.5 rounded-xl text-xs sm:text-sm transition active:scale-95 cursor-pointer">
                    ⚖️ 社會與倫理
                </button>
            </div>
        </div>

        <!-- 核心辯題卡片（左右對決，字體與格子加大，移除類別） -->
        <div id="topicCard" class="pop-card bg-white p-5 sm:p-6 rounded-3xl shadow-sm border border-slate-200 flex flex-col justify-between shrink-0">
            <!-- 題目名稱標題 -->
            <div class="mb-3 pb-2 border-b border-slate-100 text-center sm:text-left">
                <span id="topicTitle" class="text-xl sm:text-2xl font-black text-slate-800 tracking-wide">
                    📌 辯題名稱
                </span>
            </div>

            <!-- 正反方左右分一半（加大版格子與字體） -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 my-1">
                <!-- 🟢 正方 -->
                <div class="bg-emerald-50/90 p-5 sm:p-6 rounded-2xl border-2 border-emerald-300 flex flex-col justify-center min-h-[130px]">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-lg">🟢</span>
                        <span class="text-xs sm:text-sm font-black text-emerald-800 bg-emerald-200 px-2.5 py-0.5 rounded-md">正方立場</span>
                    </div>
                    <p id="proText" class="text-xl sm:text-2xl font-black text-emerald-950 leading-relaxed tracking-wide">
                        正方主張內容填入區
                    </p>
                </div>

                <!-- 🔴 反方 -->
                <div class="bg-rose-50/90 p-5 sm:p-6 rounded-2xl border-2 border-rose-300 flex flex-col justify-center min-h-[130px]">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-lg">🔴</span>
                        <span class="text-xs sm:text-sm font-black text-rose-800 bg-rose-200 px-2.5 py-0.5 rounded-md">反方立場</span>
                    </div>
                    <p id="conText" class="text-xl sm:text-2xl font-black text-rose-950 leading-relaxed tracking-wide">
                        反方主張內容填入區
                    </p>
                </div>
            </div>
        </div>

        <!-- 思維擴展引導小提示（上下呈現兩則） -->
        <div class="bg-amber-50/80 p-4 sm:p-5 rounded-3xl border-2 border-amber-200/80 shadow-xs flex flex-col justify-between flex-grow">
            <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-amber-200/60">
                <h3 class="font-black text-amber-950 text-sm sm:text-base flex items-center gap-1.5">
                    <span>💡 思考卡關了嗎？思考擴展引導（隨機 2 則提示）：</span>
                </h3>
                <button type="button" onclick="loadRandomHints()" class="text-xs sm:text-sm text-amber-800 font-extrabold hover:underline cursor-pointer active:scale-95">
                    🔄 換一組提示
                </button>
            </div>

            <!-- 上下呈現展示區 -->
            <div id="hintsContainer" class="flex flex-col gap-2 text-xs sm:text-sm font-bold text-slate-800 my-auto">
                <!-- 隨機提示上下填入區 -->
            </div>
        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 text-center py-2 text-slate-400 text-xs shrink-0 relative z-20">
        國中特教課堂工具箱 | 03_6_debate-topics.html
    </footer>

    <!-- 腳本邏輯 -->
    <script>
