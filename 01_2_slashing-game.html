<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>切切樂反應王</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFCF6;
    --ink: #3E3A39;
    --coral: #F2A497;
    --yellow: #F6D27A;
    --blue: #A8D3E6;
    --green: #B9DAA5;
    --line: 3px solid var(--ink);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5; overflow: hidden;
  }
  .app { height: 100dvh; display: flex; flex-direction: column; gap: 8px; padding: 8px; }

  .btn {
    font: inherit; color: var(--ink); background: var(--paper);
    border: var(--line); border-radius: 999px; padding: 3px 14px;
    cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap;
    transition: transform .12s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible, button:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
  .btn.coral { background: var(--coral); }
  .btn.yellow { background: var(--yellow); }
  .btn.blue { background: var(--blue); }
  .btn.green { background: var(--green); }
  .btn[aria-pressed="true"].tog { background: var(--yellow); }

  /* 頂部 */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .title { font-size: clamp(18px, 2.6vw, 28px); letter-spacing: .1em; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .speed {
    display: flex; align-items: center; gap: 8px; border: var(--line); border-radius: 999px;
    padding: 2px 14px; background: var(--paper);
  }
  .speed input[type=range] { width: clamp(90px, 14vw, 160px); accent-color: #F2A497; }
  .speed output { min-width: 3em; text-align: center; font-variant-numeric: tabular-nums; }

  /* 題目列 */
  .qbar {
    border: var(--line); border-radius: 28px; background: var(--paper);
    padding: 8px 18px 10px; text-align: center;
  }
  .qmeta { display: flex; justify-content: space-between; font-size: 14px; }
  .qtext { margin: 2px 0 6px; font-size: clamp(18px, 2.6vw, 30px); line-height: 1.45; overflow-wrap: anywhere; }
  body.single .qtext { font-size: clamp(22px, 3.4vw, 40px); }
  .tbar { height: 14px; border: var(--line); border-radius: 999px; background: var(--paper); overflow: hidden; }
  .tbar i { display: block; height: 100%; width: 100%; background: var(--green); transition: width .2s linear; }
  .tbar i.low { background: var(--coral); }
  body.bold .qtext, body.bold .lab, body.bold .chips span { font-weight: 700; -webkit-text-stroke: .7px var(--ink); }

  /* 遊戲區 */
  #playwrap { position: relative; flex: 1; min-height: 0; }
  #panels { position: absolute; inset: 0; display: grid; gap: 8px; grid-template-columns: 1fr 1fr; touch-action: none; user-select: none; -webkit-user-select: none; }
  #panels.one { grid-template-columns: 1fr; }
  #trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .panel {
    position: relative; border: var(--line); border-radius: 28px; background: var(--tint);
    display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
  }
  .hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; border-bottom: var(--line); background: var(--tc); }
  .hud .chip { font-size: clamp(16px, 2.2vw, 24px); letter-spacing: .1em; }
  .hud .score { font-size: clamp(22px, 3.4vw, 40px); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .lives { display: flex; align-items: center; gap: 5px; font-size: 13px; }
  .lives i { width: 16px; height: 16px; border: var(--line); border-radius: 50%; background: var(--paper); display: inline-block; }
  .lives i.used { background: var(--coral); }
  .field { position: relative; flex: 1; min-height: 0; overflow: hidden; }

  .fruit { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; will-change: transform; pointer-events: none; }
  .fruit svg.ico { display: block; }
  .lab {
    background: var(--paper); border: var(--line); border-radius: 20px; padding: 4px 10px;
    text-align: center; line-height: 1.35; overflow-wrap: anywhere; width: 100%;
  }
  .fx { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; }
  .fx .half { position: absolute; left: 0; top: 0; }
  .fx .l { clip-path: inset(0 50% 0 0); animation: halfL .8s ease-in forwards; }
  .fx .r { clip-path: inset(0 0 0 50%); animation: halfR .8s ease-in forwards; }
  @keyframes halfL { to { transform: translate(-50px, 90px) rotate(-35deg); opacity: 0; } }
  @keyframes halfR { to { transform: translate(50px, 90px) rotate(35deg); opacity: 0; } }
  .pop { position: absolute; font-size: clamp(24px, 4vw, 44px); white-space: nowrap; animation: rise .9s ease-out forwards; -webkit-text-stroke: 3px var(--paper); paint-order: stroke fill; }
  .pop.good { color: #5E9A45; } .pop.bad { color: #C9604F; }
  @keyframes rise { to { transform: translateY(-60px); opacity: 0; } }
  .panel.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-7px); } 60% { transform: translateX(7px); } }

  .cool, .review {
    position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 8px; padding: 16px; overflow: auto;
  }
  .cool { background: var(--coral); }
  .cool .n { font-size: clamp(60px, 12vw, 130px); line-height: 1; }
  .cool p, .review p { margin: 0; font-size: clamp(16px, 2.2vw, 24px); }
  .review { background: var(--paper); justify-content: flex-start; }
  .review h3 { margin: 0; font-weight: 400; font-size: clamp(20px, 3vw, 32px); letter-spacing: .08em; background: var(--coral); border: var(--line); border-radius: 999px; padding: 2px 22px; }
  .review .rq { font-size: clamp(16px, 2.2vw, 26px); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chips span { border: var(--line); border-radius: 999px; background: var(--green); padding: 2px 14px; font-size: clamp(14px, 1.9vw, 22px); }

  #between {
    position: absolute; inset: 0; z-index: 6; background: rgba(255, 252, 246, .96);
    border: var(--line); border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 16px; overflow: auto;
  }
  #between h3 { margin: 0; font-weight: 400; font-size: clamp(22px, 3.4vw, 36px); background: var(--yellow); border: var(--line); border-radius: 999px; padding: 2px 26px; }

  /* 彈跳視窗 */
  dialog {
    border: var(--line); border-radius: 28px; background: var(--paper); color: var(--ink);
    width: min(720px, 94vw); max-height: 94dvh; padding: 18px 22px; font-family: inherit; overflow: auto;
  }
  dialog::backdrop { background: rgba(62, 58, 57, .4); }
  dialog h2 { margin: 0 0 6px; font-weight: 400; font-size: 26px; letter-spacing: .1em; }
  dialog p { margin: 4px 0 8px; font-size: 14px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 6px 0; flex-wrap: wrap; }
  dialog select { font: inherit; color: var(--ink); background: #fff; border: var(--line); border-radius: 999px; padding: 3px 14px; max-width: 100%; }
  dialog textarea {
    width: 100%; min-height: 200px; resize: vertical; font: inherit; font-size: 15px; color: var(--ink);
    background: #fff; border: var(--line); border-radius: 18px; padding: 10px 14px;
  }
  .dlg-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; }
  .err { color: #B4473A; font-size: 14px; min-height: 1.5em; margin: 6px 0 0; white-space: pre-line; }

  /* 結果 */
  .overlay { position: fixed; inset: 0; background: var(--paper); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
  .result { position: relative; z-index: 2; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 760px; width: 100%; }
  .result h2 { margin: 0; font-weight: 400; font-size: clamp(30px, 6vw, 56px); letter-spacing: .1em; }
  .scores { display: flex; gap: 14px; justify-content: center; align-items: flex-end; width: 100%; }
  .sc { flex: 1; max-width: 280px; border: var(--line); border-radius: 28px; background: var(--paper); padding: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .sc.win { background: var(--tc); }
  .sc .nm { font-size: clamp(16px, 2.4vw, 24px); }
  .sc .pt { font-size: clamp(32px, 7vw, 64px); line-height: 1.1; }
  .sc .note { font-size: 13px; }
  .sc svg { width: clamp(70px, 14vw, 120px); height: auto; }
  .sc.win svg { animation: jump .7s ease-in-out infinite; }
  @keyframes jump { 50% { transform: translateY(-16px); } }
  .confetti { position: fixed; top: -20px; width: 12px; height: 16px; border: 2px solid var(--ink); border-radius: 4px; z-index: 31; animation: fall linear infinite; pointer-events: none; }
  @keyframes fall { to { transform: translateY(112vh) rotate(540deg); } }
  @media (prefers-reduced-motion: reduce) { .sc.win svg, .confetti { animation: none; } }
</style>
</head>
<body class="single">
<div class="app">
  <header class="bar">
    <a class="btn yellow" href="index.html">回首頁</a>
    <div class="title">切切樂反應王</div>
    <div class="tools">
      <label class="speed" for="speed">速度
        <input type="range" id="speed" min="0.4" max="1.6" step="0.1" value="1">
        <output id="speedOut" for="speed">1.0x</output>
      </label>
      <button class="btn blue" id="bankBtn" type="button">題庫／模式</button>
      <button class="btn tog" id="boldBtn" type="button" aria-pressed="false">字體加粗</button>
      <button class="btn green" id="soundBtn" type="button">音效：開</button>
      <button class="btn coral" id="fsBtn" type="button">全螢幕</button>
    </div>
  </header>

  <section class="qbar" aria-live="polite">
    <div class="qmeta"><span id="qNo">尚未開始</span><span id="qLeft"></span></div>
    <p class="qtext" id="qText">按右上角「題庫／模式」開始遊戲</p>
    <div class="tbar"><i id="tFill"></i></div>
  </section>

  <div id="playwrap">
    <div id="panels" class="one"></div>
    <canvas id="trail"></canvas>
    <div id="between" hidden>
      <h3>時間到！</h3>
      <div>本題的正確答案</div>
      <div class="chips" id="betAns"></div>
      <button class="btn coral" id="nextBtn" type="button">下一題</button>
    </div>
  </div>
</div>

<dialog id="bankDlg">
  <h2>遊戲設定</h2>
  <div class="row">
    <span>模式</span>
    <button class="btn tog" id="modeSingle" type="button" aria-pressed="true">單人</button>
    <button class="btn tog" id="modeTeam" type="button" aria-pressed="false">小組對抗（藍隊 vs 黃隊）</button>
  </div>
  <div class="row">
    <label for="presetSel">預設題庫</label>
    <select id="presetSel"></select>
  </div>
  <p>每行一題，格式：題目／[混淆選項1][混淆選項2][[正確選項1]][[正確選項2]]<br>
  正確選項用雙層括號 [[ ]]，混淆選項用單層 [ ]，全形或半形皆可，空格不影響；每題至少 1 個正確與 1 個混淆選項。<br>
  輸入內容只會當作題目資料使用。</p>
  <textarea id="bankInput" spellcheck="false"></textarea>
  <p class="err" id="bankErr" role="alert"></p>
  <div class="dlg-actions">
    <button class="btn" id="bankCancel" type="button">取消</button>
    <button class="btn coral" id="bankStart" type="button">開始</button>
  </div>
</dialog>

<div class="overlay" id="result" hidden>
  <div class="result">
    <svg width="100" height="100" viewBox="0 0 110 110" aria-hidden="true">
      <path d="M30 14h50v28c0 17-11 28-25 28S30 59 30 42z" fill="#F6D27A" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      <path d="M30 22H14c0 16 6 26 18 28M80 22h16c0 16-6 26-18 28" fill="none" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
      <path d="M55 70v16M36 96h38" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
      <rect x="38" y="86" width="34" height="12" rx="5" fill="#F2A497" stroke="#3E3A39" stroke-width="3"/>
    </svg>
    <h2 id="resTitle"></h2>
    <div class="scores" id="resScores"></div>
    <div id="resMeta"></div>
    <div class="tools" style="justify-content:center">
      <button class="btn coral" id="againBtn" type="button">再來一局</button>
      <button class="btn blue" id="newBankBtn" type="button">換題庫／模式</button>
      <a class="btn yellow" href="index.html">回首頁</a>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================================
   * 【預設題庫區｜擴充指引】
   * 想新增預設題庫時，請只改這一區：
   *  1. 複製下面任一個 { id: ..., name: ..., text: `...` } 區塊，
   *     貼在最後一個區塊後面，並在前一個區塊結尾補上逗號 ,
   *  2. id：英文或數字，不可與其他題庫重複。
   *  3. name：顯示在「預設題庫」下拉選單中的名稱。
   *  4. text：用反引號 ` ` 包住，每行一題，格式如下：
   *       題目／[混淆選項1][混淆選項2][[正確選項1]][[正確選項2]]
   *     - 正確選項用雙層括號 [[ ]]，混淆選項用單層 [ ]（全形［］也可以）
   *     - 括號之間有空格不影響；每題至少 1 個正確、1 個混淆選項，選項總數最多 20 個
   *     - 每個選項建議 30 字以內（水果上要放得下）
   *     - text 內不要出現反引號 ` 或 ${
   *  5. 陣列第一個題庫，會是開啟頁面時預設載入的題庫。
   * ===================================================================== */
  var PRESET_BANKS = [
    {
      id: 'class-rules',
      name: '課堂參與規則',
      text: `關於「友善與思考」的課堂參與原則，哪些是正確的行為與態度？／[同學答不上來時立刻大聲搶答或嘲笑][把同學當作競爭對手，暗中較勁][遇到不懂的問題就直接放棄思考][[一進教室就完成加分與繳交聯絡簿]][[展現積極參與，主動思考與專心聆聽]][[當同學答不上來時，輕聲引導與給予鼓勵]][[與同學建立合作關係而非競爭關係]][[打造充滿友善與深度思考的教室氛圍]]
在這間教室裡，我們應該如何與同學互動及面對學習困難？／[意見不同時直接批評對方講得很爛][小組討論時把工作全部推給組長處理][把回答錯誤當作一件很丟臉的事][[同學卡關時進行輕聲引導與溫和協助]][[視彼此為互相支持的合作夥伴]][[尊重不同意見並溫和表達自己想法]][[勇於提問並嘗試從不同角度多加思考]][[將回答錯誤視為正常的學習與思考過程]]`
    }
    // ↑ 在這裡新增下一個題庫（記得上一個 } 後面要有逗號）
  ];

  /* ---------- 遊戲參數（可自行調整） ---------- */
  var Q_SECONDS = 30;          // 每題時間（秒）
  var HOVER_SECONDS = 2.5;     // 水果在空中停滯的時間（秒）
  var FALL_BASE = 110;         // 水果基本下落速度（像素／秒），再乘上速度橫桿的倍率
  var WRONG_WINDOW_MS = 5000;  // 計算「連續錯誤」的時間窗
  var WRONG_LIMIT = 5;         // 時間窗內錯誤觸碰達此次數 → 暫停冷靜
  var COOL_SECONDS = 3;        // 冷靜時間（秒）
  var COOL_MAX = 3;            // 冷靜次數達此值 → 終止遊戲
  var CONSEC_FROM = 1;         // 連續第幾次錯誤起開始倒扣（1＝每次錯誤都扣；2＝連續第 2 次起才扣）
  var WRONG_PENALTY = 0.5;
  var BETWEEN_SECONDS = 7;     // 每題結束後顯示正確答案的秒數

  var INK = '#3E3A39', SKIN = '#FFE3CF';
  var BLUE = '#A8D3E6', YELLOW = '#F6D27A', GREEN = '#B9DAA5', CORAL = '#F2A497';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var panelsEl = $('#panels'), trail = $('#trail'), tctx = trail.getContext('2d');
  var dlg = $('#bankDlg'), bankInput = $('#bankInput'), bankErr = $('#bankErr');
  var resultEl = $('#result'), betweenEl = $('#between');

  var G = null, teams = [], mode = 'single', speed = 1, lastTs = 0;

  /* ---------- 工具 ---------- */
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function numText(n) { return n % 1 ? n.toFixed(1) : String(n); }

  /* ---------- 音效 ---------- */
  var actx = null, soundOn = true;
  function ensureAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; } }
  function tone(f, at, d, type, v) {
    if (!soundOn || !actx) return;
    var o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + at;
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v || 0.18, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + d + 0.05);
  }
  var sfx = {
    good: function () { tone(880, 0, 0.1, 'triangle'); tone(1175, 0.08, 0.18, 'triangle'); },
    bad: function () { tone(190, 0, 0.22, 'sawtooth', 0.12); },
    cool: function () { tone(330, 0, 0.2, 'sine'); tone(262, 0.18, 0.35, 'sine'); },
    stop: function () { tone(262, 0, 0.2, 'sawtooth', 0.12); tone(196, 0.2, 0.2, 'sawtooth', 0.12); tone(131, 0.4, 0.4, 'sawtooth', 0.12); },
    next: function () { tone(660, 0, 0.12, 'sine'); tone(880, 0.1, 0.16, 'sine'); },
    win: function () { [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) { tone(f, i * 0.16, 0.3, 'triangle', 0.2); tone(f / 2, i * 0.16, 0.3, 'sine', 0.1); }); }
  };
  $('#soundBtn').addEventListener('click', function () { soundOn = !soundOn; this.textContent = '音效：' + (soundOn ? '開' : '關'); if (soundOn) { ensureAudio(); sfx.good(); } });

  /* ---------- SVG 水果 ---------- */
  var S = ' stroke="' + INK + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
  var FRUITS = [
    // 蘋果
    '<path d="M50 30C22 18 6 50 22 74C30 88 42 90 50 86C58 90 70 88 78 74C94 50 78 18 50 30Z" fill="' + CORAL + '"' + S + '/>' +
    '<path d="M50 30Q50 18 57 10" fill="none"' + S + ' stroke-width="4"/>' +
    '<path d="M57 18Q70 6 80 16Q68 26 57 18Z" fill="' + GREEN + '"' + S + '/>' +
    '<path d="M27 50Q29 42 36 38" fill="none" stroke="#FFFCF6" stroke-width="4" stroke-linecap="round"/>',
    // 檸檬
    '<path d="M8 54Q18 30 50 30Q82 30 92 54Q82 78 50 78Q18 78 8 54Z" fill="' + YELLOW + '"' + S + '/>' +
    '<path d="M50 30Q50 20 58 16" fill="none"' + S + ' stroke-width="4"/>' +
    '<path d="M58 22Q70 10 82 20Q70 30 58 22Z" fill="' + GREEN + '"' + S + '/>' +
    '<path d="M28 50Q32 44 40 42" fill="none" stroke="#FFFCF6" stroke-width="4" stroke-linecap="round"/>',
    // 梨子

    var p = ptrs[e.pointerId];
    if (!p || p.done) return;
    var last = p.pts[p.pts.length - 1];
    p.pts.push({ x: e.clientX, y: e.clientY, t: performance.now() });
    hitSegment(last.x, last.y, e.clientX, e.clientY);
  });
  function endPtr(e) { if (ptrs[e.pointerId]) ptrs[e.pointerId].done = true; }
  panelsEl.addEventListener('pointerup', endPtr);
  panelsEl.addEventListener('pointercancel', endPtr);

  /* ---------- 設定視窗 ---------- */
  var presetSel = $('#presetSel');
  (function () {
    var o0 = document.createElement('option'); o0.value = ''; o0.textContent = '自訂輸入'; presetSel.appendChild(o0);
    PRESET_BANKS.forEach(function (p) { var o = document.createElement('option'); o.value = p.id; o.textContent = p.name; presetSel.appendChild(o); });
  })();
  function loadPreset(id) {
    var p = PRESET_BANKS.filter(function (x) { return x.id === id; })[0];
    if (p) { bankInput.value = p.text.trim(); presetSel.value = id; }
    bankErr.textContent = '';
  }
  presetSel.addEventListener('change', function () { loadPreset(presetSel.value); });
  bankInput.addEventListener('input', function () { presetSel.value = ''; });

  function setMode(m) {
    mode = m;
    $('#modeSingle').setAttribute('aria-pressed', m === 'single' ? 'true' : 'false');
    $('#modeTeam').setAttribute('aria-pressed', m === 'team' ? 'true' : 'false');
  }
  $('#modeSingle').addEventListener('click', function () { setMode('single'); });
  $('#modeTeam').addEventListener('click', function () { setMode('team'); });

  function openDlg() { bankErr.textContent = ''; $('#bankCancel').hidden = !G; if (!dlg.open) dlg.showModal(); }
  $('#bankBtn').addEventListener('click', openDlg);
  $('#bankCancel').addEventListener('click', function () { dlg.close(); });
  $('#bankStart').addEventListener('click', function () {
    var r = parseBank(bankInput.value);
    var fatal = r.errors.filter(function (e) { return e.indexOf('最多 50') === -1; });
    if (fatal.length) { bankErr.textContent = fatal.slice(0, 5).join('\n'); return; }
    if (!r.items.length) { bankErr.textContent = '請至少輸入一題。'; return; }
    ensureAudio(); dlg.close(); startGame(r.items);
  });
  $('#againBtn').addEventListener('click', function () { ensureAudio(); startGame(G.items); });
  $('#newBankBtn').addEventListener('click', function () { resultEl.hidden = true; openDlg(); });

  /* ---------- 速度、加粗、全螢幕 ---------- */
  var speedEl = $('#speed');
  speedEl.addEventListener('input', function () { speed = parseFloat(speedEl.value) || 1; $('#speedOut').textContent = speed.toFixed(1) + 'x'; });
  var boldBtn = $('#boldBtn');
  boldBtn.addEventListener('click', function () { var on = document.body.classList.toggle('bold'); boldBtn.setAttribute('aria-pressed', on ? 'true' : 'false'); });
  var fsBtn = $('#fsBtn'), root = document.documentElement;
  if (!(root.requestFullscreen || root.webkitRequestFullscreen)) fsBtn.hidden = true;
  fsBtn.addEventListener('click', function () {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    } catch (e) {}
  });
  function fsLabel() { fsBtn.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? '退出全螢幕' : '全螢幕'; }
  document.addEventListener('fullscreenchange', fsLabel);
  document.addEventListener('webkitfullscreenchange', fsLabel);

  /* ---------- 初始化 ---------- */
  requestAnimationFrame(function loop0(ts) { if (!G) { drawTrails(); requestAnimationFrame(loop0); } });
  if (PRESET_BANKS.length) loadPreset(PRESET_BANKS[0].id);
  openDlg();
})();
</script>
</body>
</html>
